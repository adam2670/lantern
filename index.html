<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1830">
<title>Odyssey</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Odyssey">
<!--
  ODYSSEY — an expedition game.
  Rule: this page contains nothing about the person using it. No names, no notes, no history.
  Progress, the parent code and any license key are stored only in this browser (localStorage);
  the service worker keeps copies of the game's own files for offline play. The only network
  requests are for Odyssey's own files on its own server: the page, the adventure files, the
  pictures. Nothing leaves unless a grown-up sends a report or feedback; no analytics, no
  cookies, no tracking.
-->
<style>
  :root{
    --sky0:#0b1830; --sky1:#1d3a63; --ink:#0a1222;
    --panel:#101d36; --panel2:#16264a; --line:#2a3f68;
    --text:#e8eefc; --muted:#9fb1d4; --dim:#7e91b4;
    --amber:#ffb454; --amber2:#ff8c3a; --green:#4fd18b; --red:#ff6b6b; --blue:#6fb7ff;
    --radius:16px;
    /* Outline of things you tap (buttons, answer choices, camp tiles): 3:1 against every panel color,
       the WCAG 1.4.11 bar for controls. --line stays the softer border for decorative cards. */
    --control-line:#4d71b7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:calc(18px * var(--ts, 1));line-height:1.45;-webkit-text-size-adjust:100%}
  body{min-height:100vh;display:flex;flex-direction:column}
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  input{font:inherit}
  /* ---------- keyboard and screen reader ----------
     .sr-only: text only a screen reader reads. Used for the live region that speaks the result
     of an answer, and for the words that mark which choice was picked and which was right.
     The focus ring is never removed: anything a keyboard can land on shows a 2px amber outline. */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .btn:focus-visible,.choice:focus-visible,#nav button:focus-visible,#nav a:focus-visible,
  .answer input:focus-visible,.finale button:focus-visible,.camp:focus-visible,.slot:focus-visible,
  textarea:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  /* Headings and the question are focused when a screen renders, so that a screen reader starts
     reading there. They are not controls and are not in the tab order, so they show no ring — the
     ring belongs to things you can press. */
  [tabindex="-1"]:focus{outline:none}
  .passage:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* ---------- scene ---------- */
  #scene{position:relative;background:#0b1830;overflow:hidden}
  #scene img.bg{position:relative;display:block;width:100%;height:clamp(230px,42vh,560px);object-fit:cover;object-position:center}
  #sceneBlur{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.55);display:none}
  @media (min-width:1100px){ #scene img.bg{object-fit:contain} #sceneBlur{display:block} #scene svg#build{inset:auto 0 4% 0} }
  /* The small-screen title strip grows at the heading rate (--tsh) and stops at 1.3 times, like the
     base rule's --tsh, so the "small" strip is never bigger than the full one and does not cover the
     mountain at larger text sizes. Unchanged at the default size: 12px either way. */
  @media (max-width:420px){ #hud{font-size:calc(12px * min(var(--tsh, 1), 1.3))} #hud span{display:none} }
  /* "#scene #hud": the plain #hud rule further down the sheet would otherwise win the tie. */
  @media (orientation:landscape) and (min-width:640px) and (max-width:899px){ #scene #hud{font-size:calc(12px * min(var(--tsh, 1), 1.3));letter-spacing:.02em} }
  /* Two columns, scene beside the screen, in landscape from 640px wide: that now includes a phone
     held sideways and the iPhone Duo's outer screen open sideways (about 678 by 466), where one tall
     scrolling column left the mission below the fold. The scene column narrows with the window. */
  @media (orientation:landscape) and (min-width:640px){
    /* Only #screen scrolls here. If the document itself could scroll, a scroll position left over from
       the one-column layout (a passage read halfway down, then the window tiled sideways) would shift
       the whole grid up and cut the guide's bubble off at the top: seen on the iPad, September 14. */
    html{overflow:hidden;height:100vh;height:100dvh}
    body{display:grid;grid-template-columns:minmax(240px,40%) 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"scene companion" "scene screen" "scene nav";height:100vh;height:100dvh;min-height:0;overflow:hidden}
    #scene{grid-area:scene;height:100vh;height:100dvh;display:flex;align-items:center}
    #scene img.bg{height:100vh;height:100dvh;max-height:none;object-fit:contain;padding-left:env(safe-area-inset-left)}
    #sceneBlur{display:block}
    #scene:after{display:none}
    #scene svg#build{inset:auto 0 6% 0}
    /* The scene column is only about 270px wide at the narrow end (the Duo's outer screen sideways,
       678px), where the title strip wrapped word by word and split "0 FT" over two lines. */
    #hud{gap:10px}
    #hud .r{white-space:nowrap}
    /* body> on these two: the plain #companion and #screen rules further down the sheet come later
       and would win the tie, and did: the companion row lost its safe-area top padding in the app
       (the label above the guide's line was cut off in a tiled iPad window, September 14, 2026;
       in a desktop browser the inset is zero, so nothing showed). */
    /* The companion row is auto-sized, and an auto track does NOT shrink. A long line from the
       guide grew it to 274 of a 292 px viewport (measured, Safari landscape, 20 September), which
       pushed the nav row 67 px below the visible area with html/body locked to overflow:hidden, so
       the tabs could not be reached at all. Capping it and letting the bubble scroll inside its own
       row is what keeps the nav on screen: the guide can say anything and the tabs stay put.
       The vh line before each dvh line is the pre-Safari-15.4 fallback (see the four height rules
       above) - an old iPad on a pre-15.4 Safari must keep the vh line rather than lose the rule. */
    body>#companion{grid-area:companion;margin:0;max-width:none;padding-top:calc(14px + env(safe-area-inset-top))}
    /* The cap goes INSIDE the bubble, and it took two tries to land there. On #companion it made
       the row a scroll container, whose automatic minimum size is zero, so the auto track collapsed
       to its padding and the guide vanished (measured h=14 in a 292 px viewport). On #bubble itself
       it clipped the speech tail: #bubble:before/:after sit at left:-8px, outside the padding box
       that overflow:auto clips to, so the pointer at the raven disappeared. On the inner wrapper
       both survive - #companion still sizes to content, and the tail is drawn by an element that is
       never clipped. */
    body>#companion #bubble>div{max-height:40vh;max-height:40dvh;overflow:auto;-webkit-overflow-scrolling:touch}
    /* --kb is the height of the on-screen keyboard over this column while a box is being typed in
       (set by the keyboard keeper at the end of the script, absent otherwise): extra room at the
       bottom so the column can scroll the box up above the keyboard. */
    body>#screen{grid-area:screen;overflow:auto;max-width:none;margin:0;-webkit-overflow-scrolling:touch;padding-bottom:calc(28px + var(--kb, 0px))}
    #nav{grid-area:nav}
    /* On a desktop or a 13-inch iPad sideways the column is up to 1152px wide; the cards keep to a
       reading width inside it, as the one-column layout does (layout audit, 17 Oct 2026). */
    body>#screen>*{max-width:900px;margin-left:auto;margin-right:auto}
  }
  /* A phone held sideways with the keyboard up leaves about 50pt between the guide's row and the
     keyboard, less than the answer box, and the question scrolls out of sight. While typing there
     the guide's row steps aside (the keeper sets body.kb) and comes back when the keyboard goes
     (layout audit, 17 Oct 2026). Taller two-column screens (iPads, the unfolded Duo) keep it. */
  @media (orientation:landscape) and (min-width:640px) and (max-height:500px){ body.kb>#companion{display:none} }
  /* The same at larger text on taller ones: on the Duo's inner screen at the largest size the box and Check (223pt) did not fit between the guide's row and the keyboard (196pt) (Duo, 25 Oct 2026). */
  @media (orientation:landscape) and (min-width:640px) and (max-height:720px){ html[data-textsize=larger] body.kb>#companion>*{display:none} }   /* its children only: the row keeps its safe-area top padding, so the column stays clear of the status bar */
  /* One column on a short sideways screen (an SE held sideways, a small Stage Manager window): the
     picture's 230px floor took most of a 320pt screen, so it gives way to the mission there. */
  @media (orientation:landscape) and (max-width:639px) and (max-height:450px){ #scene img.bg{height:min(42vh,230px)} }
  #scene svg{position:absolute;inset:0;width:100%;height:100%}
  #scene svg#build{inset:auto 0 6% 0;height:22%;top:auto}
  #build .part{fill:#1a2440;stroke:#6a7ea6;stroke-width:2;stroke-dasharray:6 6;opacity:.55}
  #build .part.on{fill:url(#gMetal);stroke:#ffe9a8;stroke-dasharray:none;opacity:1}
  #build .detail{opacity:0} #build .on .detail{opacity:1}
  #build .blade{opacity:0;transition:opacity .4s} #build .blade.on{opacity:1}
  #scene:after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--ink))}
  /* The HUD sits directly on the scene photo, which can be any brightness. A flat scrim behind
     it (rather than a gradient that could thin out under the second line) guarantees the muted
     label text keeps 4.5:1 against even a pure-white patch of photo — tools/check-contrast.py
     proves it. */
  #hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;
    background:rgba(10,18,34,.85);
    padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));font-size:calc(14px * var(--tsh, 1));color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  #hud b{color:var(--text);font-weight:600}
  /* In a resizable iPad window the system draws its window controls (the three dots) over the app's
     top-left corner, on top of the header's first word. The page cannot tell a window from a small
     screen on its own (inside a window WebKit reports the window's size as the screen), so the app
     shell says which it is (window.odysseyWindowed) and the header moves past the controls. */
  html.windowed #hud{padding-left:calc(76px + env(safe-area-inset-left))}
  #hud .r{text-align:right}

  /* ---------- companion ---------- */
  #companion{display:flex;gap:12px;align-items:flex-start;padding:12px 16px 0;max-width:820px;margin:0 auto;width:100%}
  #raven{flex:0 0 72px;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#22375f,#101d36);border:2px solid var(--amber);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #raven img{width:100%;height:100%;object-fit:cover;object-position:center}
  #bubble{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 16px;position:relative;min-height:52px;display:flex;align-items:center;min-width:0}   /* min-width:0: a long word at large text wraps inside the bubble instead of pushing the page sideways */
  #bubble:before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
  #bubble:after{content:"";position:absolute;left:-7px;top:18px;border:8px solid transparent;border-right-color:var(--panel2);border-left:0}
  #bubble .who{display:block;font-size:calc(12px * var(--ts, 1));letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}
  #bubble.nudge{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,180,84,.15)}

  /* ---------- main ---------- */
  #screen{flex:1;max-width:820px;margin:0 auto;width:100%;padding:14px 16px 28px}
  /* In the app the page runs under the status bar and the Dynamic Island (viewport-fit=cover, the
     shell ignores safe areas), so anything scrolled to the top — a mission's progress bar, the
     Flag button, a card's heading — collided with the clock. This strip is the height of the top
     inset, in the page's own ground, above everything: content scrolls under it, not through it.
     Zero height in a browser. Same fix as the secondary pages (12 Sept 2026). */
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top, 0px);background:var(--ink);z-index:100;pointer-events:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
  h1,h2,h3{margin:0 0 8px;line-height:1.2}
  h1{font-size:calc(28px * var(--tsh, 1))} h2{font-size:calc(22px * var(--ts, 1))} h3{font-size:calc(17px * var(--ts, 1));color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  p{margin:0 0 10px}
  .muted{color:var(--muted)} .dim{color:var(--dim);font-size:calc(15px * var(--ts, 1))}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--control-line);
    background:var(--panel2);color:var(--text);border-radius:14px;padding:14px 18px;min-height:52px;
    font-weight:600;transition:transform .08s,background .15s,border-color .15s}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(180deg,var(--amber),var(--amber2));color:#2a1600;border-color:transparent}
  .btn.ghost{background:transparent}
  .btn.wide{width:100%}
  .btn.small{min-height:44px;min-width:44px;padding:8px 12px;font-size:calc(15px * var(--ts, 1));border-radius:10px}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn.flag{border-color:#8c7040;color:var(--amber)}
  /* Three soft glows, then the amber edge stays as a steady highlight: nothing moving lasts past 5 seconds (WCAG 2.2.2). */
  .btn.flag.pulse{animation:pulse 1.1s ease-in-out 3;border-color:var(--amber)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,180,84,.0)}50%{box-shadow:0 0 0 6px rgba(255,180,84,.25)}}

  .camps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
  .camp{background:var(--panel2);border:1px solid var(--control-line);border-radius:12px;padding:10px 6px;text-align:center;
    font-size:calc(13px * var(--ts, 1));color:var(--muted);cursor:pointer;min-height:70px;display:flex;flex-direction:column;justify-content:center;gap:4px}
  .camp b{display:block;font-size:calc(20px * var(--tsh, 1));color:var(--text)}
  .camp.done{border-color:var(--green);color:var(--green)} .camp.done b{color:var(--green)}
  .camp.next{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,180,84,.12)}
  .camp.locked{opacity:.75;cursor:default}

  .passage{background:#0c1730;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;max-height:38vh;overflow:auto;font-size:calc(18px * var(--ts, 1));line-height:1.6}
  .passage p{margin:0 0 12px} .passage p:last-child{margin:0}
  .passage p .pn{color:var(--dim);font-size:calc(13px * var(--ts, 1));margin-right:6px;vertical-align:top}
  /* How much room the welcome card leaves under itself when it lifts the two questions clear of
     Safari's floating pill. A little deeper than the strip the pill occupies, so the last row of
     grade tiles ends above it rather than flush against it. See renderWelcome. */
  #wgrades{scroll-margin-bottom:132px}
  /* Empty scroll room under the welcome card, height 0 until a lift needs it. See renderWelcome. */
  #wroom{height:0}
  /* One scroll area, not two, when the screen is short. The passage keeps its own scroll box when
     there is room for the question and the choices beside it — that is the point of it, so a child
     can read without losing sight of what he is answering. On a SHORT screen (a phone on its side,
     an iPad Split View pane in landscape) it backfires: the choices fall below the fold and the
     passage is the last thing on the screen, which is exactly where a thumb lands, so a swipe
     scrolls a thousand pixels of field report while the page does not move and the answers look
     unreachable. Measured at 320x560: no choice on screen at all, first choice 237px below the
     fold. Under this height the passage simply flows and the page is the only thing that scrolls.
     Height only, so no phone or tablet store frame changes. Item 2, NEXT-1.0.3.md, 17 Sept 2026. */
  @media (max-height:700px){ .passage{max-height:none;overflow:visible} }
  .lookfor{margin:8px 0 0;padding-left:22px} .lookfor li{margin:6px 0}
  .q{font-size:calc(21px * var(--ts, 1));font-weight:600;margin:6px 0 12px}
  /* A task card is a column so the Flag / ↺ row can be drawn at the top while coming last in the
     page's order (keyboard: question → choices → Still stuck? → Flag). A column does not squash
     touching margins the way a plain block does, so the spacing is written out here to land on
     exactly the same pixels as before. */
  /* the parent report: a key, then one card per day with lined cells, then the overall tables with lines */
  /* A report table wider than its card scrolls sideways; when it really is cut off, a line above it
     says so, or a parent on a phone reads four columns as the whole table (layout audit, 17 Oct 2026). */
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .scrollx.cut::before{content:'Scroll the table sideways for the rest of its columns.';display:block;position:sticky;left:0;font-size:calc(14px * var(--ts, 1));color:var(--dim);margin:0 0 6px}
  .rkey{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0 4px}
  .rkey h3{margin:0 0 6px} .rkey dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:calc(15px * var(--ts, 1))} .rkey dt{color:var(--amber);font-weight:600} .rkey dd{margin:0;color:var(--muted)}
  @media (max-width:520px){ .rkey dl{grid-template-columns:1fr} .rkey dd{margin-bottom:4px} }
  html[data-textsize=larger] .rkey dl{grid-template-columns:1fr}
  .rday{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--panel2)}
  .rhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:calc(15px * var(--ts, 1))} .rhead b{font-size:calc(17px * var(--ts, 1))}
  .rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .rcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;min-height:58px}
  .rcell:nth-child(4n){border-right:0} .rcell:nth-last-child(-n+3){border-bottom:0}
  .rcell .rl{font-size:calc(11px * var(--ts, 1));letter-spacing:.06em;text-transform:uppercase;color:var(--muted)} .rcell .rv{font-size:calc(22px * var(--ts, 1));font-weight:700;font-variant-numeric:tabular-nums} .rcell .rv small{font-size:calc(13px * var(--ts, 1));font-weight:500;color:var(--muted)}
  .rscore{grid-row:span 2;background:#132043} .rscore .rv{font-size:calc(40px * var(--tsh, 1));color:var(--amber)}
  @media (max-width:420px){ .rgrid{grid-template-columns:repeat(3,1fr)} .rcell:nth-child(4n){border-right:1px solid var(--line)} .rcell:nth-child(3n){border-right:0} .rcell:nth-last-child(-n+3){border-bottom:1px solid var(--line)} .rcell:last-child{border-bottom:0} .rscore{grid-row:span 2} }
  /* The day's questions, one line each, folded away behind a summary. Parents asked to see which
     ones their child got right and which he got wrong, not just the tallies (Adam, 16 September
     2026). Closed by default, so the report still reads as numbers first and the detail is there
     for the parent who wants it. */
  .rqs{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  .rqs summary{cursor:pointer;font-size:calc(14px * var(--ts, 1));color:var(--blue);min-height:44px;display:list-item;padding:10px 0;box-sizing:border-box}
  .rqlist{margin:6px 0 0;padding:0;list-style:none}
  .rq{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .rq:last-child{border-bottom:0}
  .rq .mark{font-weight:700;font-size:calc(15px * var(--ts, 1));line-height:1.35}
  .rq .rqq{font-size:calc(15px * var(--ts, 1))}
  .rq .rqleg{font-size:calc(11px * var(--ts, 1));letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .rqhead{margin:12px 0 0;font-size:calc(11px * var(--ts, 1));letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .rqsteps{margin:4px 0 0;padding-left:18px;font-size:calc(14px * var(--ts, 1));color:var(--muted)} .rqsteps li{margin:1px 0}
  .rq .rqa{grid-column:2;font-size:calc(14px * var(--ts, 1));color:var(--muted)}
  .rq .rqa b{color:var(--text);font-weight:600}
  .rq.ok .mark{color:var(--green)} .rq.half .mark{color:var(--amber)} .rq.no .mark{color:var(--red)}
  table.lined td,table.lined th{border:1px solid var(--line);padding:6px 8px}
  .taskcard{display:flex;flex-direction:column;scroll-margin-top:calc(8px + env(safe-area-inset-top))}
  .taskcard>.legbar{order:-2}
  .taskcard>.toprow{order:-1;margin-bottom:6px}
  .taskcard>.passage{margin-top:4px}
  .taskcard>.q,.taskcard>.steps,.taskcard>.answer{margin-top:0}
  .taskcard>.steps>li:first-child{margin-top:0} .taskcard>.steps>li:last-child{margin-bottom:0}
  .choices{display:grid;gap:10px}
  .choice{text-align:left;justify-content:flex-start;font-weight:500}
  .choice.right{border-color:var(--green);background:rgba(79,209,139,.12)}
  .choice.wrong{border-color:var(--red);background:rgba(255,107,107,.10);opacity:.7}
  .answer{display:flex;gap:10px;margin-top:6px}
  .answer input{flex:1;min-width:0;min-height:52px;border-radius:14px;border:1px solid #4f6a9a;background:#0c1730;color:var(--text);
    padding:0 16px;font-size:calc(22px * var(--ts, 1));outline:none}
  .answer input:focus{border-color:var(--blue)}
  /* Chromium's default placeholder gray is 3.9:1 on the box; --dim is 5.6:1 (accessibility audit, 17 Oct 2026). */
  .answer input::placeholder,textarea::placeholder{color:var(--dim);opacity:1}
  .answer input.right{border-color:var(--green)} .answer input.wrong{border-color:var(--red)}

  @media (max-width:520px){html{font-size:calc(17px * var(--ts, 1))} .camps{gap:6px} .camp{font-size:calc(12px * var(--ts, 1));min-height:62px} .big{font-size:calc(38px * var(--tsh, 1))}}

<script>
  // Dynamic Type (1.0.14). The text follows the system text size: Settings, then Display & Brightness,
  // then Text Size, or Accessibility's Larger Text. iOS reports that size through the system body
  // font (17 px at the default), and every font size on this page is written as
  // calc(N px * var(--ts, 1)). At the default size nothing is set, so every size computes to exactly
  // what it was before this existed. Headings (28 px and up) grow at half the rate (--tsh), so the
  // largest sizes stay on the screen. Only on Apple touch devices: a Mac's system body font is 13 px,
  // and a desktop browser has no such font at all, so neither must shrink or move a thing.
  (function(){
    var root=document.documentElement;
    function touchApple(){
      try{ return !!window.ODYSSEY_APP || /iPhone|iPad|iPod/.test(navigator.userAgent) ||
        (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }catch(e){ return false; }
    }
    var probe=null;
    function measure(){
      var p=probe, temp=!p;
      if(temp){
        p=document.createElement('span');
        p.style.cssText='font:-apple-system-body;position:absolute;visibility:hidden;pointer-events:none;left:0;top:0';
        p.textContent='x'; root.appendChild(p);
      }
      var px=parseFloat(getComputedStyle(p).fontSize);
      if(temp) p.parentNode.removeChild(p);
      return px;
    }
    function apply(){
      try{
        var r=1;
        if(touchApple() && window.CSS && CSS.supports && CSS.supports('font','-apple-system-body')){
          var px=measure(); if(px>0) r=px/17;
        }
        if(Math.abs(r-1)<0.02){ root.style.removeProperty('--ts'); root.style.removeProperty('--tsh'); root.removeAttribute('data-textsize'); return; }
        r=Math.max(0.82, Math.min(r, 3.2));
        root.style.setProperty('--ts', r.toFixed(3));
        root.style.setProperty('--tsh', (1+(r-1)/2).toFixed(3));
        root.setAttribute('data-textsize', r>1?'larger':'smaller');
      }catch(e){}
    }
    // Text Size can change while the page stays on screen: the Control Center slider, or Settings
    // beside the app in Split View on an iPad. A hidden probe stays in the page, set in the system
    // body font, and a ResizeObserver sees its box change the moment iOS changes that font, in
    // whatever order WebKit's own update lands (Fable review, 5 October 2026).
    function watch(){
      try{
        if(!touchApple() || !window.ResizeObserver || !document.body) return;
        // Without the system body font the probe would inherit the page's own text size, grow with it,
        // and call apply() for nothing; so watch only where iOS actually supplies that font.
        if(!(window.CSS && CSS.supports && CSS.supports('font','-apple-system-body'))) return;
        probe=document.createElement('span');
        probe.setAttribute('aria-hidden','true');
        probe.style.cssText='font:-apple-system-body;position:absolute;visibility:hidden;pointer-events:none;left:0;top:0;white-space:nowrap';
        probe.textContent='x';
        document.body.appendChild(probe);
        new ResizeObserver(apply).observe(probe);
      }catch(e){}
    }
    apply();
    // A grown-up changes Text Size in the Settings app, then comes back: the page was hidden meanwhile.
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) apply(); });
    window.addEventListener('pageshow', apply);
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', watch); else watch();
  })();
</script>

  // ---------------- loading an adventure ----------------

  // written). The questions themselves live one file per adventure in missions/, and are fetched

  // every one it has ever seen: once the prefetch has run, the whole year works offline.
  const _campaignLoads = {};
  function loadCampaign(id){
    const k = M.campaigns.find(c=>c.id===id);
    if(!k) return Promise.reject(new Error('unknown adventure: '+id));
    if(k.full) return Promise.resolve(k);
    if(_campaignLoads[id]) return _campaignLoads[id];
    if(!k.file) return Promise.reject(new Error('no file for adventure: '+id));
    // A page left open across two publishes still holds the old index, so it asks for a filename
    // the site has since cleared out, and "Try again" would ask for the same dead name forever.
    // So one failure reads the index afresh, and if this adventure has a new name, tries that once.
    const pr = injectCampaign(k)
      .catch(e=>freshCampaignFile(id).then(f=>{ if(!f || f===k.file) throw e; k.file=f; return injectCampaign(k); }, ()=>{ throw e; }))
      .catch(e=>{ delete _campaignLoads[id]; throw e; });

    pr.catch(e=>{ try{ logError('load', e&&e.message, k.file); }catch(_){} });

    return new Promise((resolve, reject)=>{

      el.onerror=()=>{ el.remove(); reject(new Error('could not load '+k.file)); };

    return fetch('missions.js', { cache:'no-cache' }).then(r=>r.ok ? r.text() : '').then(text=>{
      const m=text.match(new RegExp('missions/'+id.replace(/[^A-Za-z0-9_-]/g,'\\$&')+'\\.[A-Za-z0-9]+\\.js'));
      return m ? m[0] : null;

  function loadCampaigns(ids, onProgress){
    const list=ids.filter((id,i)=>ids.indexOf(id)===i).filter(id=>{ const k=M.campaigns.find(c=>c.id===id); return k && k.file && !k.full; });
    const total=list.length; let done=0, next=0;

    const worker=()=>{ if(next>=list.length) return Promise.resolve();

  // used to delete the five mission records, which took those days out of the parent report for
  // good (data-integrity audit, 1 October 2026). Now the records stay; each carries the lap it was
  // last played in, and "done" on the trail means done in the current lap. Finishing a mission
  // again goes through the same path as replaying one mission: the first run is kept, the new one
  // is its latest, attempts goes up. Stars and medals are untouched either way.
  function campLap(k){ return ((S.laps||{})[k.id])||0; }
  function recLap(r){ return Math.max(r.lap||0, (r.latest&&r.latest.lap)||0); }

  // ---------------- stars and medals ----------------
  // Stars are per mission, one to three, worked out from the run that just happened, and they count
  // ONLY the answers that were right the first time. An answer got right after the hint is a second
  // look: it is worth finishing the mission, and it is not worth a star. Three stars therefore means
  // a clean run and nothing less. What is kept is
  // the BEST run that mission has ever had, so coming back to one can raise it and can never lower
  // it. A campaign's medal is the metal those stars add up to:
  //     bronze  the campaign is finished
  //     silver  every mission stands at two stars or better
  //     gold    every mission stands at three
  // The gap between them is real and it is meant to be visible: gold is not handed out for
  // finishing. What is always true, and always said, is that any mission can be played again.
  const TIERS=['bronze','silver','gold'];

  // empty place on the shelf never borrows the look of one that was earned.
  const BLANK_MEDAL='assets/medal-frame.png';
  function medalSrc(t){ return TIERS.indexOf(t)>=0 ? 'assets/medal-'+t+'.png' : BLANK_MEDAL; }

  function tierCap(t){ return t ? t.charAt(0).toUpperCase()+t.slice(1) : ''; }

  // gold for work nobody did.
  // firstTry: the answers right the first time. A record stores the total right (got) and how many
  // of those took a second look after the hint (retry), so the first-try count is the difference.
  function firstTry(r){ const got=r.recon[0]+r.nav[0]+r.orders[0]; return Math.max(0, got-(r.retry||0)); }
  // One number out of 100 for a mission, the thing a parent asked for after the launch (Adam,
  // September 16, 2026: "actual 1-100 scores after each session"): a first-try answer counts in
  // full, an answer after a hint counts half, an answer that had to be shown counts nothing. Stars
  // keep their own rule (first-try answers only) and medals keep theirs; this is the plain readout.
  function missionScore(r){ const total=(r.recon||[0,0])[1]+(r.nav||[0,0])[1]+(r.orders||[0,0])[1]; if(!total) return null;   // a record from a camp code has no questions in it

  // ---------------- scene ----------------
  // The trail has to scale exactly as the picture under it does. In two columns the picture is
  // "contain" from 640px (CSS above), so the trail is "meet" from 640px too. It used to switch at
  // 900px, left over from before the two-column breakpoint moved down, and between 640 and 900 (the
  // Duo's outer screen sideways is 678) the trail was drawn off the mountain: seen on the Duo
  // simulator, 2 October 2026.
  function letterboxed(){ return window.innerWidth>=1100 || twoColumns(); }
  function twoColumns(){ return window.matchMedia('(orientation: landscape) and (min-width: 640px)').matches; }
  // "Windowed" means the app has less than the whole screen: a Split View pane, a Stage Manager
  // window, a tiled half. Only the app shell can tell (see BaseCampApp.swift, tellWindowed); it calls
  // this with true or false on every layout change. On the web it is never called.
  window.odysseyWindowed = function(w){ document.documentElement.classList.toggle('windowed', !!w); };
  function drawScene(){
    const c=camp();
    const scene=document.getElementById('scene'); const img=document.getElementById('sceneImg'); const svg=document.getElementById('mtn');
    if(c.scene){ scene.classList.remove('noart'); if(img.getAttribute('src')!==c.scene) img.src=c.scene; document.getElementById('sceneBlur').style.backgroundImage=`url('${c.scene}')`; } else { scene.classList.add('noart'); }
    svg.setAttribute('preserveAspectRatio', letterboxed() ? 'xMidYMid meet' : 'xMidYMid slice');
    document.getElementById('hudPeak').textContent=c.title;
    document.getElementById('hudRegion').textContent=c.subtitle||'';
    document.getElementById('hudAlt').textContent=progressText();
    document.getElementById('hudStreak').textContent = liveStreak()>0 ? (liveStreak()+'-day streak') : '';
    if(c.waypoints && c.scene){
      svg.style.display='block';
      const W=c.waypoints;
      document.getElementById('route').setAttribute('points', W.map(w=>w.join(',')).join(' '));
      const top=W[W.length-1]; document.getElementById('flag').setAttribute('transform',`translate(${top[0]},${top[1]-6})`);
      const g=document.getElementById('camps'); g.innerHTML='';
      c.patrols.forEach((p,i)=>{ const wp=W[Math.min(i+1,W.length-1)]; const k=document.createElementNS('http://www.w3.org/2000/svg','circle');
        k.setAttribute('cx',wp[0]); k.setAttribute('cy',wp[1]); k.setAttribute('r',13);
        k.setAttribute('fill', doneIn(p,c) ? '#4fd18b' : '#0b1830'); k.setAttribute('stroke','#ffe9a8'); k.setAttribute('stroke-width','4'); g.appendChild(k); });
      moveClimber(W[Math.min(doneCount(), W.length-1)]);
    } else { svg.style.display='none'; }
    const b=document.getElementById('build');
    if(c.buildArt && BUILD_ART[c.buildArt]){ b.style.display='block'; if(b.dataset.art!==c.buildArt){ b.innerHTML=BUILD_ART[c.buildArt]; b.dataset.art=c.buildArt; }
      const n=doneCount();
      b.querySelectorAll('.part').forEach(p=>p.classList.toggle('on', Number(p.dataset.i)<n));
      const ch=(S.choices||{})[c.id]; const F=c.finale; const lit = ch!=null && F;
      b.querySelectorAll('.blade').forEach(el=>el.classList.toggle('on', !!lit));
      if(lit){ const col=F.options[ch].color; b.querySelectorAll('.tint').forEach(el=>el.setAttribute('fill',col)); }
    } else b.style.display='none';
    const gi=document.getElementById('guideImg'); if(gi.getAttribute('src')!==avatarSrc(form())) gi.src=avatarSrc(form());
  }
  function moveClimber(target){
    const el=document.getElementById('climber');
    // Under reduced motion the climber is placed, not hopped along the trail (accessibility audit, 17 Oct 2026).
    const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!climberPos || still){ climberPos=target.slice(); el.setAttribute('transform',`translate(${target[0]},${target[1]})`); return; }
    const from=climberPos.slice(), t0=performance.now(), dur=1400;
    function step(t){ const k=Math.min(1,(t-t0)/dur), e=k<.5?2*k*k:-1+(4-2*k)*k;
      const x=from[0]+(target[0]-from[0])*e, y=from[1]+(target[1]-from[1])*e - Math.sin(k*Math.PI)*18;
      el.setAttribute('transform',`translate(${x},${y})`); if(k<1) requestAnimationFrame(step); else climberPos=target.slice(); }
    requestAnimationFrame(step);
  }

  // ---------------- screens ----------------
  const screen=document.getElementById('screen');

  // ---------------- keyboard and screen reader helpers ----------------
  // announce(): say something to a screen reader without putting it on the glass. The region is
  // cleared first so the same words twice in a row (two right answers) are still read out twice.
  function announce(msg){
    const el=document.getElementById('live'); if(!el) return;
    el.textContent='';
    setTimeout(()=>{ el.textContent=msg; }, 60);
  }
  // takeFocus(): move the reading position without moving the page. preventScroll keeps the view
  // exactly where the sighted layout already put it, so nothing looks different to a player using
  // a finger.
  function takeFocus(el){ if(!el) return; try{ el.focus({preventScroll:true}); }catch(e){ try{ el.focus(); }catch(e2){} } }
  // focusBack(): after a screen redraws itself, put focus back on the control that was used, and bring
  // it into view if the redraw left it off screen (a keyboard user has to see where they are).
  function focusBack(el){ if(!el) return; if(!el.matches('button,a[href],input,select,textarea,[tabindex]')) el.setAttribute('tabindex','-1'); takeFocus(el); try{ el.scrollIntoView({block:'nearest'}); }catch(e){} }
  // A few tiles are drawn as boxes rather than buttons (the camps on Base Camp, the medals on the
  // shelf). If it behaves like a button it has to answer the keyboard like one.
  function pressable(el, fn){ if(!el) return; el.onclick=fn;
    el.addEventListener('keydown', ev=>{ if(ev.key==='Enter'||ev.key===' '||ev.key==='Spacebar'){ ev.preventDefault(); fn(); } }); }
  // The heading of a screen, focused after it renders so a screen reader starts at the top of what
  // just changed instead of re-reading the whole page.
  function focusHeading(root){
    // The screen's own title first: the arrival card has a small caption ("Sitka · raven form") above
    // its h1. It is drawn as an h3 but marked role="none", so it does not read as a heading that comes
    // before the screen's title (WCAG 1.3.1).
    const r=root||screen, h=r.querySelector('h1')||r.querySelector('h2,h3'); if(!h) return;
    if(!h.hasAttribute('tabindex')) h.setAttribute('tabindex','-1');
    takeFocus(h);
  }

    // Latching is the trap here, and this lane fell into it. The previous version set its "done"
    // flag at the end of every run that got past the guard — on ATTEMPT, not on success. So when a

    // finished, and the later runs that exist precisely to correct that returned early at the

    // than no fix at all. Hypothesis from the infrastructure lane, confirmed here in the code.
    //
    // So: this settles only when the row is MEASURED clear, or when clearing it would push the name
    // field off the top, which is the one honest compromise — the name is asked first. Every other
    // outcome leaves it unsettled and the next run tries again with more room. It does not trust
    // scrollIntoView either: that scrolls as far as the document allows and stops without saying
    // so, which is the silent failure that started all of this. Room first, then move the real
    // scroller by the measured shortfall, then look again.

      // to Safari — so here the lift protects against nothing and costs the one thing this screen
      // has to do well. Measured on the shipping binaries, fresh install, first launch: on build 12
      // the Flattop scene fills the top of the screen and it looks like a game; with the lift
      // running it scrolls almost entirely off and a child lands on a form. A first screen is worth
      // more than a scroll position. Scope a fix to the thing it protects against, not to a
      // viewport height — that was the mistake here.
      if(window.ODYSSEY_APP){ settled=true; return; }

      if(clear()){ settled=true; return; }

      for(let i=0; i<4 && !clear(); i++){
        const need=Math.ceil(last.getBoundingClientRect().bottom - (vpH()-STRIP));

      // it had to compromise either: a compromise reached on the first frame, before the art has
      // laid the card out, would otherwise be frozen in as if it were the answer. An unsettled run
      // simply gets tried again from a more settled page, and by the last retry the layout is done.

      if(doneIn(p,c)){ if(confirm('Do "'+p.title+'" again for practice? Your first score stays in the report; this one is logged as another attempt.')) startPatrol(p); return; }
      if(nxt && nxt.id===p.id){ startPatrol(p); return; }
      say(null, 'Not yet. Finish '+(nxt?('"'+nxt.title+'"'):'the one before')+' first. They build on each other.'); }));
  }

  // A chooser tile draws its picture in a box about 257px wide, and thirty-six of them at once.
  // The 640px thumb looks identical in that box, is a fifth of the bytes, and the prefetch has
  // already fetched it — the full 1536px scene belongs behind the game, not in a tile. Derived
  // the same way the prefetch list derives it. A campaign with no scene gets no picture.
  function thumbSrc(k){ return k.scene ? k.scene.replace('scene-','thumb-').replace(/\.png$/,'.jpg') : ''; }

  function renderChooser(currentLocked){
    const c=camp();
    VIEW='chooser';
    say(null, currentLocked ? 'That one is still being packed. Pick another.' : (doneCount()>=c.patrols.length && c.patrols.length ? 'Campaign complete. Where next? Your call.' : 'Where to? Your call.'));
    let h=`<div class="card"><span class="tag">Choose</span><h1>Next campaign</h1><p class="muted">Each one is a week. Sitka changes shape to fit in.</p><div class="picks">`;
    M.campaigns.filter(k=>k.ready!==false).forEach(k=>{
      const f=M.companion.forms[k.form]||{label:''}; const packed=k.patrols.length>0; const fin=packed && doneCount(k)>=k.patrols.length; const cur=k.id===c.id; const mt=tierOf(k);
      const shut=locked(k), price=PRICES[FULL_YEAR]; const th=thumbSrc(k);
      // The title is the heading of its tile, so heading navigation can hop between the thirty-six.
      // It stays a <b> because that is what it looks like; the role is what a reader goes by.
      // The button says only "Choose" on the glass, which tells a reader nothing about which of the
      // thirty-six it belongs to — so its name carries the campaign, keeping the visible word first.
      const pick=fin?'Do it again':(cur?'Continue':'Choose');
      h+=`<div class="pick ${packed&&!shut?'':'locked'}"><div class="thumb" style="${th?`background-image:url('${th}')`:''}"></div><div class="body">
        <span class="form">${shut&&!fin?'Locked':`Sitka · ${esc(f.label)} form${k.patrols.some(p=>pNavGrade(p,S.grade))?' · grade '+esc(S.grade)+((S.grade==='7'||S.grade==='8')&&hasRecon78(k)?' reading and numbers':' math'):''}`}</span><b role="heading" aria-level="3">${esc(k.title)}</b><span class="sub">${esc(k.subtitle||'')}</span><p>${esc(k.pitch||'')}</p>
        ${(mt&&(!shut||fin))?`<span class="sub"><span class="tierword metal-${mt}">${tierCap(mt)}</span> medal.${nextTier(mt)?' '+tierNeeds(mt)+' '+REPLAY_LINE:''}</span>`:''}
        ${!packed ? `<span class="dim">Still being packed. Check back soon.</span>`
          : shut ? (EDITION==='app' ? `<button type="button" class="btn" data-unlock="1">Unlock the year${price?' · '+esc(price):''}</button>`
                                    : `<button type="button" class="btn" data-weblock="${k.id}" aria-label="${esc(k.title)} is in the app">In the app</button>`)
                 : `<button type="button" class="btn ${cur&&!fin?'':'primary'}" data-choose="${k.id}" aria-label="${esc(pick+': '+k.title)}">${pick}</button>`}
      </div></div>`;
    });
    h+=`</div>`;
    h+=yearNoteHtml();
    h+=`</div>`;
    h+=shelfHtml();
    screen.innerHTML=h; window.scrollTo(0,0); screen.scrollTop=0; focusHeading(); familyMount('chooser');
    // Same as the shelf at Base Camp: an earned medal is a button, so the keyboard can reach it and
    // the label it already carries is read out. Without the role and the tabindex it is a picture
    // with a click handler on it, which a keyboard cannot press and a screen reader will not offer.
    screen.querySelectorAll('.slot.earned').forEach(el=>{ el.setAttribute('role','button'); el.setAttribute('tabindex','0');
      pressable(el, ()=>{ const k=M.campaigns.find(x=>x.id===el.dataset.badge); if(k) showCeremony(k, false); }); });
    screen.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>unlockDoor());
    screen.querySelectorAll('[data-weblock]').forEach(b=>b.onclick=()=>renderWebLockCard(M.campaigns.find(x=>x.id===b.dataset.weblock)));
    screen.querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>{
      const k=M.campaigns.find(x=>x.id===b.dataset.choose);
      // Belt and braces: a locked adventure has no Choose button at all, and if one ever appeared
      // it would still not start — it opens the card that explains what is behind the lock. This
      // asks the entitlement question directly, so it holds in the moment before the shell has
      // answered, when nothing is DRAWN as locked yet.
      if(wouldLock(k)){ openLock(k); return; }
      const fin=doneCount(k)>=k.patrols.length;
      if(fin){ S.laps=S.laps||{}; S.laps[k.id]=campLap(k)+1; delete S.arrived[k.id]; delete S.finished[k.id]; }
      if(k.id!==S.campaign){ S.campaign=k.id; delete S.arrived[k.id]; }
      save(); climberPos=null; drawScene(); go('base');
    });
  }

  // Where a locked adventure sends you. Two locks, two cards, one door each.
  let START_PLACED=false;   // true once a ?start= link has placed this device (the welcome card keeps it for a new player)
  let START_LOCK=null;   // set by a ?start= link to a locked adventure (see the link handler near the end)
  function openLock(k){

  // The web edition's card. No price and no "buy" (neither belongs on the website; "free" appears

    let h=`<div class="card"><span class="tag">The whole year</span><h1>${k?esc(k.title)+' is in the app':'The rest of the year is in the app'}</h1>
      <p class="muted">On the web, Odyssey plays ${esc(free?free.title:'the first adventure')} all the way through: five missions, all three legs, the numbers at your grade, and the medal at the end. The other ${webOthers()} adventures are in the Odyssey app, on iPad and iPhone.</p>`;
    if(ended) h+= (LIC.payload.ed||[]).indexOf('home')>=0
      ? `<p class="muted">This license ended ${esc(licMonthDay(LIC.payload.end))}. Renewal: ${esc(REPORT_TO)}.</p>`
      : `<p class="muted">${esc(LIC.payload.school)}'s Odyssey license ended ${esc(licMonthDay(LIC.payload.end))}. To renew, write to ${esc(REPORT_TO)}.</p>`;
    // A license that has not begun yet: say when, or a teacher setting a cart up early sees locks
    // with no reason (web audit, 17 Oct 2026).
    if(LIC && LIC.state==='future') h+= (LIC.payload.ed||[]).indexOf('home')>=0
      ? `<p class="muted">This license begins ${esc(licLongDate(LIC.payload.start))}. Until then the web plays ${esc(free?free.title:'the first adventure')}.</p>`
      : `<p class="muted">${esc(LIC.payload.school)}'s Odyssey license begins ${esc(licLongDate(LIC.payload.start))}. Until then the web plays ${esc(free?free.title:'the first adventure')}.</p>`;
    // Safari can clear a site's saved data after weeks without a visit, and the license goes with it.
    // Said only where the device shows signs of having had the year open (an adventure kept, or

    const hadYear = (Array.isArray(S.webKept) && S.webKept.length>0) || campaignsWithProgress().some(id=>wouldLock(M.campaigns.find(x=>x.id===id)));
    if(!LIC && hadYear) h+=`<p class="dim">If this device had a school or home license, paste it again in Settings, or open the school's link once more.</p>`;
    h+=`<p class="dim">Nothing here is lost. Every mission and medal on this device stays where it is, and Settings, then <b>Moving to another device</b>, carries all of it into the app.</p>
      <p style="margin-top:14px"><a class="btn primary wide" href="${APP_STORE_URL}" target="_blank" rel="noopener">Odyssey on the App Store</a></p>
      <div class="row" style="margin-top:10px"><button type="button" class="btn small ghost" id="webLockBack">Back to the adventures</button></div></div>`;
    screen.innerHTML=h; window.scrollTo(0,0); screen.scrollTop=0; focusHeading();   // the one full screen that left focus on the body (a11y audit, 23 Oct 2026)
    document.getElementById('webLockBack').onclick=()=>{
      // Back from a locked adventure that was the CURRENT one goes to the first adventure rather
      // than straight back into this card.
      if(locked(camp())){ S.campaign=freeCampaignId()||S.campaign; save(); climberPos=null; drawScene(); }
      renderChooser(false);
    };
  }
  // The whole year, what it costs, and the two buttons. Both sit behind two doors, because the App
  // Store's Kids Category is explicit that a child must not be able to reach a purchase alone:
  // first the four digits a parent already set for the field report, and then — in the app shell,
  // where this page cannot reach it — a native "Ask a grown-up" question with arithmetic a
  // young player cannot do mentally. Either one refused buys nothing.
  // Where the card was opened from: 'lock' (a locked adventure), 'chooser' or 'settings'. A redraw
  // passes nothing and keeps the last one.
  let UNLOCK_FROM='chooser';
  function renderUnlockCard(from){
    if(from) UNLOCK_FROM=from;
    VIEW='unlock';
    const price=PRICES[FULL_YEAR];
    const all=M.campaigns.filter(k=>k.ready!==false);
    const free=M.campaigns.find(k=>k.id===freeCampaignId());
    say(null, ENT.fullYear ? 'All of it is yours. Pick one.' : (UNLOCK_FROM==='lock' ? 'That one is locked. A grown-up decides this.' : 'The whole year, for a grown-up to decide.'));
    let h=`<div class="card"><span class="tag">The whole year</span><h1>Odyssey: the whole year</h1>`;
    if(ENT.fullYear){
      h+=`<p class="muted">Unlocked on this device. All ${all.length} adventures, every grade, no connection needed.</p>
        <button type="button" class="btn primary wide" id="unlockBack">Back to the adventures</button>`;
    } else {
      h+=`<p class="muted">${esc(free?free.title:'The first adventure')} is free and always will be — five missions, all three legs, the numbers at your grade, and the medal at the end. One payment opens the other ${all.length-1}: a school year of them, about twenty minutes a day.</p>
        <ul class="steps" style="font-size:calc(16px * var(--ts, 1))">
          <li><b>${all.length} adventures</b>, one a week, September to June.</li>
          <li><b>Every grade from 3 to 8.</b> Everyone reads the same story; the numbers change, and at grades 7 and 8 the reading questions do too.</li>
          <li><b>All of it on the device.</b> No connection needed, ever.</li>
          <li><b>No ads, no accounts, nothing collected.</b> A parent report stays behind the parent code.</li>
        </ul>
        <p><b>${price?esc(price)+', once.':'One payment.'}</b> Not a subscription, and there is nothing else to buy to finish the year.</p>
        <p class="dim">A grown-up has to do this part: the parent code comes first, then the app asks one arithmetic question, then Apple asks for the payment. It is charged to the Apple ID signed in on this device, and Family Sharing shares it with the rest of the family at no extra cost.</p>
        <button type="button" class="btn primary wide" id="unlockBuy">${price?'Unlock the year for '+esc(price):'Unlock the year'}</button>
        <div class="row" style="margin-top:10px"><button type="button" class="btn small" id="unlockRestore">Restore purchases</button><button type="button" class="btn small ghost" id="unlockBack">Not now</button></div>
        <p class="dim" id="unlockMsg" role="status" style="margin-top:10px"></p>`;
    }
    h+=`</div>`;
    screen.innerHTML=h; window.scrollTo(0,0); screen.scrollTop=0;
    // "Not now" goes back where the card came from. From a locked CURRENT adventure (a refund, Family
    // Sharing stopped) it also moves the player onto the free adventure, as the web card does, or the
    // Base Camp tab would open this card again on every tap (purchase audit, 17 Oct 2026).
    const back=document.getElementById('unlockBack'); if(back) back.onclick=()=>{
      if(UNLOCK_FROM==='settings' && !ENT.fullYear){ go('settings'); return; }
      if(locked(camp())){ S.campaign=freeCampaignId()||S.campaign; save(); climberPos=null; drawScene(); }
      renderChooser(false);
    };
    const buy=document.getElementById('unlockBuy');
    // The gate draws its own screen over this card, so when it lets the buyer through the card has
    // to be drawn again before the store is asked: otherwise "unlockMsg" is not on the page, the
    // "one more question" line never shows, and the native sheets rise over a form that still says
    // "Set a parent code", which is what a parent saw after canceling Apple's sheet on the iOS 27
    // simulator, September 15. Redrawn, the sheets rise over this card and canceling lands here.
    if(buy) buy.onclick=()=>behindParentCode('to buy the rest of the year', ()=>{
      renderUnlockCard(); const m=document.getElementById('unlockMsg');
      if(!storeSend('store.buy', {product:FULL_YEAR})){ if(m) m.textContent='The store is not available right now.'; return; }
      if(m) m.textContent='One more question for a grown-up…'; });
    const rest=document.getElementById('unlockRestore');
    if(rest) rest.onclick=()=>behindParentCode('to check for a purchase already made', ()=>{
      renderUnlockCard(); const m=document.getElementById('unlockMsg');
      if(!storeSend('store.restore', {})){ if(m) m.textContent='The store is not available right now.'; return; }
      if(m) m.textContent='One more question for a grown-up…'; });
    focusHeading();
  }

  // ---------------- mission ----------------
  // What the record says is soft: first-try rate under 70% with at least 3 tries. Sorted weakest first.
  function softSkills(){ try{ return skillRollup(allRows()).filter(r=>r.n>=3 && r.first/r.n<0.7).sort((a,b)=>a.first/a.n-b.first/b.n).map(r=>r.skill); }catch(e){ return []; } }
  // Items at this grade, tagged with a skill, drawn only from missions already finished (no spoilers). Reading items carry their passage.
  function poolFor(skill, includeUnfinishedOtherCampaigns){
    const out=[]; M.campaigns.forEach(k=>{ if(!k.full) return; k.patrols.forEach(p=>{ const ok = S.done[p.id] || (includeUnfinishedOtherCampaigns && k.id!==S.campaign && !wouldLock(k)); if(!ok) return; /* a locked adventure's unplayed missions never reach the tent, even if its file is loaded (license audit, 6 Oct) */
      reconFor(p).questions.forEach((x,i)=>{ if((x.skill||'Reading')===skill) out.push(shuffleChoices({leg:'recon', type:'mcq', idx:i, q:x.q, choices:x.choices, answer:x.answer, hint:x.hint, skill:skill, passage:reconFor(p).passage, passageTitle:reconFor(p).title, secs:0, nudged:false, from:p.id}, p.id, i)); });
      navFor(p).problems.forEach((x,i)=>{ if((x.skill||'Math')===skill) out.push({leg:'nav', type:'input', idx:i, q:x.q, answer:x.answer, accept:x.accept||[], hint:x.hint, skill:skill, secs:0, nudged:false, from:p.id}); });
      if((p.orders.skill||'Following directions')===skill) out.push({leg:'orders', type:'orders', idx:0, steps:p.orders.steps, prompt:p.orders.prompt, answer:p.orders.answer, accept:p.orders.accept||[], hint:p.orders.hint, skill:skill, secs:0, nudged:false, from:p.id});
    }); }); return out; }
  // Never the mission being played: a replay of mission 1 drew a bonus item that was the exact
  // question just answered in the same run (parent audit, 17 Oct 2026).
  function bonusItems(cur){
    const soft=softSkills().slice(0,2); const items=[];
    soft.forEach(sk=>{ const pool=poolFor(sk,false).filter(t=>!cur || t.from!==cur.id); if(pool.length){ const t=pick(pool); items.push(Object.assign({}, t, {leg:'extra', idx:items.length, origLeg:t.leg, secs:0, nudged:false})); } });
    return items; }
  function buildQueue(p){
    const q=[];
    // Each reading question carries its own passage, as the practice tent's already do, so a run
    // paused before a content update resumes with the passage its questions were written for, not
    // the new one. Runs saved before this have none and fall back to the live passage in renderTask.
    const rc=reconFor(p);
    rc.questions.forEach((x,i)=>q.push(shuffleChoices({leg:'recon', type:'mcq', idx:i, q:x.q, choices:x.choices, answer:x.answer, hint:x.hint, skill:x.skill||'Reading', passage:rc.passage, passageTitle:rc.title, secs:0, nudged:false}, p.id, i)));
    navFor(p).problems.forEach((x,i)=>q.push({leg:'nav', type:'input', idx:i, q:x.q, answer:x.answer, accept:x.accept||[], hint:x.hint, skill:x.skill||'Math', secs:0, nudged:false}));
    q.push({leg:'orders', type:'orders', idx:0, steps:p.orders.steps, prompt:p.orders.prompt, answer:p.orders.answer, accept:p.orders.accept||[], hint:p.orders.hint, skill:p.orders.skill||'Following directions', secs:0, nudged:false});
    bonusItems(p).forEach(b=>q.push(b));
    return q;
  }
  // A mission in progress survives a reload. Safari on a phone throws a background tab away
  // whenever it likes, and a child who switched to another app for a minute came back to Base
  // Camp with the leg gone (found on the WebKit baseline, 13 Sept 2026). So the run is written to
  // the profile after every answer and every step, as plain data: the queue as it was drawn, the
  // position, the flagged list, the tallies. It is read back for the same adventure, on any later
  // day (renderBase), and then the mission carries on from the same question. Leaving on
  // purpose (Start again, the practice tent, finishing) clears it. Nothing is sent anywhere.
  function saveRun(){
    if(!R){ return; }
    try{
      // Belt and braces for the parking in renderBase: never write over another adventure's run.
      if(S.run && S.run.campaign!==camp().id){ S.parkedRuns=S.parkedRuns||{}; S.parkedRuns[S.run.campaign]=S.run; }
      S.run={ patrolId:R.patrol.id, campaign:camp().id, day:today(), elapsed:Date.now()-R.start, queue:R.queue, i:R.i, phase:R.phase,
              flagged:R.flagged.map(t=>({leg:t.leg, idx:t.idx})), lastLeg:R.lastLeg, start:R.start,
              res:R.res, flags:R.flags, unanswered:R.unanswered, tasks:R.tasks, hasExtra:!!R.hasExtra, grade:R.grade };
      save();
    }catch(e){}
  }
  function clearRun(){ if(S.run){ delete S.run; save(); } }
  function resumeRun(p){
    const r=S.run;
    const queue=r.queue||[];
    const flagged=(r.flagged||[]).map(f=>queue.find(t=>t.leg===f.leg && t.idx===f.idx)).filter(Boolean);
    R={ patrol:p, queue:queue, i:r.i||0, phase:r.phase||'main', flagged:flagged, lastLeg:r.lastLeg||null,
        start:(typeof r.elapsed==='number' ? Date.now()-r.elapsed : (r.start||Date.now())),
        res:r.res, flags:r.flags||0, unanswered:r.unanswered||0, tasks:r.tasks||[], taskStart:Date.now(), hasExtra:!!r.hasExtra, grade:r.grade||null };
    if(!R.res){ R=null; clearRun(); return false; }
    document.getElementById('nav').style.display='none';
    say(null, 'Picking up where you left off.');
    nextTask();
    return true;
  }
  // The bonus round draws from missions already finished, which may sit in other adventures.
  // Fetch those files first (they are almost always in the cache already), then begin.
  function startPatrol(p){
    const need=campaignsWithProgress().filter(id=>{ const k=M.campaigns.find(c=>c.id===id); return k && !k.full; });
    if(need.length){
      renderLoading('Getting today\'s '+((camp().dayNoun||'mission').toLowerCase())+' ready…');
      loadCampaigns(need, loadingProgress)
        .then(()=>{ const q=camp().patrols.find(x=>x.id===p.id)||p; beginPatrol(q); })
        .catch(()=>renderLoadTrouble(()=>go('base')));
      return;
    }
    beginPatrol(p);
  }
  function beginPatrol(p){
    R=null;   // a finished run's grade must not carry into the new one while its queue is drawn
    R={ patrol:p, queue:buildQueue(p), i:0, phase:'main', flagged:[], lastLeg:null, start:Date.now(),
        res:{recon:{c:0,t:reconFor(p).questions.length,retry:0}, nav:{c:0,t:navFor(p).problems.length,retry:0}, orders:{c:0,t:1,retry:0}, extra:{c:0,t:0,retry:0}}, flags:0, unanswered:0, tasks:[], taskStart:0 };
    R.grade=S.grade;

  function renderTask(t){

  // ---------------- three tiers of help: the child asks, it never volunteers ----------------
  function helpFor(skill){ return H[skill] || null; }
  function helpButtonHtml(t){ const hp=helpFor(t.skill); if(!hp) return ''; const tier=t.help||0; if(tier>=3) return '';

  function helpHtml(hp, tier){

    if(tier===2) return `<div class="lesson"><h3>How to: ${esc(hp.method.title)}</h3><ul>${hp.method.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="ex"><b>Example.</b> ${esc(hp.method.example)}</div></div>`;

    const b=document.getElementById('helpBtn'); if(!b) return;

      // speak, so the reading position moves into it instead.

  function record(t, result){
    t.secs += Math.round((Date.now()-R.taskStart)/1000);

    // The question itself is kept with the result, not just the tally, so the parent report can
    // list the day's questions and say which ones went which way (parents asked for it; Adam,
    // 16 September 2026). The text as asked is stored rather than a pointer into the campaign,
    // because the numbers in a Navigation question follow the child's grade and a pointer would
    // read back wrong if the grade were ever changed. It stays on the device like everything else.
    // The Orders leg is one task made of steps rather than a written question, so its steps are
    // what a parent needs to see: the whole point of it is that the last step changes the earlier
    // ones, and a child who missed that needs the list in front of him to see why.
    R.tasks.push({leg:t.leg, skill:t.skill, result:result, flagged:R.phase==='debrief', secs:t.secs, nudged:t.nudged, help:t.help||0,

  function normalize(x){ return String(x).trim().toLowerCase().replace(/[,\s$]/g,''); }
  function numVal(x){ x=normalize(x); if(!x) return NaN;
    const m=x.match(/^(-?\d+)\/(\d+)$/); if(m){ const d=Number(m[2]); return d? Number(m[1])/d : NaN; }
    const mixed=x.match(/^(-?\d+)and(\d+)\/(\d+)$/); if(mixed){ return Number(mixed[1])+Number(mixed[2])/Number(mixed[3]); }
    return /^-?\d*\.?\d+$/.test(x) ? Number(x) : NaN; }
  // What a child types around a right number: the unit the question asked for ("360 meters", "30 min",
  // "13°", "20%"), a period at the end, a mixed number with its space ("1 3/4"), a dash or a typographic
  // minus, parentheses, "8 below zero". Only an answer that starts with a number is touched, so word
  // answers, ratios like 2:3, times like 3:30 and remainders like "4 r 2" pass through unchanged
  // (Fable checker review, 9 October 2026: about 2,100 problems invited a unit the checker refused).
  function loosen(x){
    let s=String(x).trim().toLowerCase().replace(/[\u2212\u2013\u2014]/g,'-').replace(/^\((-.*)\)$/,'$1').trim().replace(/[.!]+$/,'').replace(/^(?:negative|minus)\s+(?=\d)/,'-').replace(/^[a-z]\s*=\s*(?=[-\d.$])/,'');   // "x = 4", "y = 59": the way grade 7-8 write a solution
    s=s.replace(/^\+(?=\d)/,'');   // "+5" is 5
    s=s.replace(/^(\d{1,2}:\d{2})\s*(?:a\.?m\.?|p\.?m\.?)$/,'$1');   // "3:50 pm" is the clock time 3:50
    s=s.replace(/^(-?\d+)\s+and\s+(?=\d+\s*\/\s*\d)/,'$1 ');   // "4 and 1/2" is "4 1/2", so the "and" below is not read as a second number
    // Words that change the number are not a unit: "5 and a half", "5 hundred", "6 squared", "8 below freezing".
    if(/\b(?:and|hundreds?|thousands?|millions?|dozens?|half|halves|thirds?|quarters?|fourths?|fifths?|tenths?|squared|cubed|times|plus|over|below|above)\b/.test(s) && !/^\d[\d,]*(?:\.\d+)?\s*(?:degrees?|°)?\s*below(?:\s+zero)?$/.test(s)) return s;
    // A mixed number may carry its unit too: "4 1/2 hours", "2 1/4 cups" (engine audit, 23 Oct 2026).
    const mx=s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)\s*(?:%|°\s*[cf]?|[a-z]+\.?)?(?:\s+[a-z]+\.?)*$/); if(mx) return mx[1]+'and'+mx[2]+'/'+mx[3];
    const bz=s.match(/^(\d[\d,]*(?:\.\d+)?)\s*(?:degrees?|°)?\s*below(?:\s+zero)?$/); if(bz) return '-'+bz[1];
    // "°F" and "°C" count as one unit, with or without a space: "16°F", "-16 °C" (engine audit, 23 Oct 2026).
    const m=s.match(/^(-?\$?(?:\d[\d,]*(?:\.\d+)?|\.\d+)(?:\s*\/\s*\d+)?)\s*(?:%|°\s*[cf]?|[a-z]+\.?)?(?:\s+[a-z]+\.?)*$/);

  function isCorrect(t, val){
    if(t.type==='mcq') return val===t.answer;
    const a=normalize(val); if(!a) return false;
    const accepts=[t.answer].concat(t.accept||[]).map(normalize); if(accepts.includes(a)) return true;
    const l=normalize(loosen(val)); if(l && accepts.includes(l)) return true;
    // A ratio written as a fraction, "3/4" for 3:4. A key shaped like a clock time (3:50) is left out,
    // so "3/50" is never a time (engine audit, 23 Oct 2026).
    const key=String(t.answer).trim(); if(/^\d+:\d+$/.test(key) && !/^\d{1,2}:[0-5]\d$/.test(key) && a.replace('/',':')===normalize(key)) return true;

  function startIdle(){ clearIdle();

  function finishPatrol(){
