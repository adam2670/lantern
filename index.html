    const done=(right)=>{ box.querySelectorAll('.choice, #pcheck, #pans').forEach(b=>b.disabled=true); const hb=document.getElementById('helpBtn'); if(hb) hb.remove();
      if(!right){ if(t.type==='mcq'){ const b=box.querySelector(`.choice[data-i="${t.answer}"]`); if(b){ b.classList.add('right'); markChoice(b, 'the right answer', false); } } fb.innerHTML=`<div class="reveal miss marked"><span class="mk no" aria-hidden="true">✗︎</span><div><b>Answer: ${esc(answerText(t))}</b><br><span class="muted">${esc(t.hint)}</span></div></div>`; say(null, pick(['That one got away. Look at how it goes, then take another.', 'Close is not nothing. Look at the answer, then go again.'])); }
      else { const line=pick(['That is it.', 'Clean.', 'You have got this one.', 'Yes. Again?']); say(null, line);
        // The guide's bubble sits at the top of the page, scrolled out of sight on a phone by the time a
        // child reaches Try one, so the verdict sits beside the problem: a green check or a red X (Adam, 18 Oct 2026).
        fb.innerHTML=`<div class="reveal marked"><span class="mk ok" aria-hidden="true">✓︎</span><div><b>${esc(answerText(t))}</b><br><span class="muted">${esc(line)}</span></div></div>`; }
      nx.innerHTML=`<div class="row" style="margin-top:12px"><button type="button" class="btn primary" id="pagain">Another one</button><button type="button" class="btn ghost" id="pback">Back to the method</button></div>`;
      takeFocus(document.getElementById('pagain'));
      announce(right ? 'Right.' : ('Answer: '+answerText(t)+'. '+t.hint));
      document.getElementById('pagain').onclick=()=>practiceItem(skill); document.getElementById('pback').onclick=()=>{ focusHeading(); window.scrollTo({top:0,behavior:scrollHow()}); }; };   // focus first: a focus call can stop a smooth scroll part way (layout audit N2)
    const check=(val,el)=>{ if(isCorrect(t,val)){ el.classList.add('right'); markChoice(el, 'your answer, right', true); done(true); return; } attempt++; el.classList.add('wrong'); if(t.type==='mcq'){ el.disabled=true; markChoice(el, 'your answer, not right', true); } else { el.value=''; el.focus(); setTimeout(()=>el.classList.remove('wrong'),600); }
      if(attempt===1){ fb.innerHTML=`<div class="hint marked"><span class="mk no" aria-hidden="true">✗︎</span><div><span aria-hidden="true">💡 </span>${esc(t.hint)}</div></div>`; say(null, 'Not that one. Hint is up. Have another go.');
        if(t.type==='mcq') takeFocus(box.querySelector('.choice:not([disabled])'));
        announce('Not yet. Try again. Hint: '+t.hint); } else done(false); };
    if(t.type==='mcq'){ box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>check(Number(b.dataset.i), b)); }
    else { const inp=document.getElementById('pans'); const cb=document.getElementById('pcheck'); cb.addEventListener('pointerdown', ev=>ev.preventDefault()); inp.addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); cb.click(); } }); cb.onclick=()=>{ if(!inp.value.trim()){ inp.focus(); return; } check(inp.value, inp); }; setTimeout(()=>inp.focus(),50); }
  }

  // ---------------- report ----------------
  // One row per ATTEMPT, not per mission. A mission played again is another day's work — twenty
  // more minutes, its own questions, its own score — and a report called "Day by day" that files it
  // under the first run's date is telling a parent their child did nothing today. Only the first run
  // and the most recent one are kept in the save, so a mission replayed many times contributes two
  // rows: the one it started at and the one it stands at.
  // A medal that came across in a resume code carries no date (the code has room for whether it was
  // earned, not when), so it is stored as true. It reads as where it was earned rather than "true".
  function finishedOn(v){ return v===true ? 'on another device' : (v||''); }
  // The same, in words, for the screens a child reads ("October 17, 2026", not 2026-10-17).
  function earnedOn(v){ if(v===true) return 'on another device'; const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||'')); if(!m) return String(v||'');
    try{ return 'on '+new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }catch(e){ return String(v); } }
  const PLACED=d=>/^\(/.test(String(d && d.date || ''));   // set by parent, placed by link, from a code, from another device
  function allRows(){ const rows=[];
    M.campaigns.forEach(k=>k.patrols.forEach(p=>{ const d=S.done[p.id]; if(!d) return;
      const later = (d.latest && d.latest.date) ? d.latest : null;   // a replay the same day is its own row too
      // A mission that was MARKED done and has since been played is not two events. The marker was
      // a placeholder for work nobody had done; the play is the work. Show the play and drop the
      // placeholder, or the report tells a parent both that it was never played and that it scored.
      if(!(later && PLACED(d))) rows.push({k,p,d});
      if(later) rows.push({k,p,d:later, again:!PLACED(d)}); }));
    return rows.sort((a,b)=>String(a.d.date).localeCompare(String(b.d.date))); }
  // Answers that had to be revealed in a run, counted the way the question list and the by-skill
  // table count them (the bonus round apart). R.unanswered counted only the debrief's, so a day card
  // could say nothing was shown above a question marked "Answer shown" (parent audit, 17 Oct 2026).
  function shownCount(d){ const t=(d.tasks||[]).filter(x=>x.leg!=='extra'); return t.length ? t.filter(x=>x.result==='shown').length : (d.unanswered||0); }
  function skillRollup(rows){ const m={};
    rows.forEach(({d})=>(d.tasks||[]).forEach(t=>{ const r=m[t.skill]||(m[t.skill]={skill:t.skill,n:0,first:0,retry:0,shown:0,flagged:0,nudged:0,secs:0});
      r.n++; r[t.result]++; if(t.flagged) r.flagged++; if(t.nudged) r.nudged++; r.secs+=t.secs; if(t.help) r.help=(r.help||0)+1; if(t.help>=3) r.help3=(r.help3||0)+1; }));
    return Object.values(m).map(r=>({...r, avg: r.n? Math.round(r.secs/r.n):0})).sort((a,b)=> (b.shown+b.retry+b.flagged)-(a.shown+a.retry+a.flagged)); }
  function b64u(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function reportCode(){ const rows=allRows(); const sk=skillRollup(rows);
    const payload={v:1, cs:S.callsign, g:S.grade, beta:S.betaCode||'', sent:today(),
      p: rows.filter(({d})=>d.date!=='(set by parent)'&&d.date!=='(placed by link)'&&d.date!=='(from code)'&&d.date!=='(from another device)').map(({k,p,d})=>[k.id, k.patrols.indexOf(p)+1, d.date, d.recon[0], d.recon[1], d.nav[0], d.nav[1], d.orders[0], d.orders[1], d.retry, d.flags, d.secs]),
      s: sk.map(r=>[r.skill, r.n, r.first, r.retry, r.shown, r.flagged, r.help3||0, (S.practised||{})[r.skill]||0]) };
    return 'ODYSSEY1.'+b64u(JSON.stringify(payload)); }

  // ---------------- the class code as a square the teacher's camera can read ----------------
  // WHY A SECOND FORM OF THE SAME CODE. The full class code above is a few thousand characters,
  // because it carries every mission as its own line. That is right for an email a parent sends.
  // It is far too much for a square of blocks a phone camera reads across a classroom: the square
  // would be so finely divided that a camera could not resolve it. So there is a short form,
  // ODYSSEY2, carrying exactly the numbers the class page actually charts and nothing else:
  // the callsign, the grade, the beta tag, today's date, how many missions, how many seconds, the
  // date of the last one, and per skill the tries, the first-try wins, the full walk-throughs and
  // the practice rounds. Same counts, no name, nothing new. kit/class.html reads both forms.
  //
  // The skill names are sent as numbers into the table below rather than spelled out, which is
  // most of the saving: a full year's twenty-four skills spelled out needs a 125-block square,
  // and as numbers it needs 97. THIS TABLE IS APPEND-ONLY. A name may be added at the end; no
  // name may be moved or removed, or an old square would decode to the wrong skill. The same
  // table, in the same order, is in kit/class.html — the two files are published and bundled
  // together and never travel apart. A skill that is not in the table is still sent, spelled out
  // with a * in front, so new content is never wrong, only slightly longer.
  const SKILL_CODES=['Adding and subtracting','Area and perimeter',"Author's purpose and structure",
    'Central idea and evidence','Decimals','Dividing','Equations','Finding details',
    'Following directions','Fractions','Linear relationships','Main idea','Money and decimals',
    'Multi-step problems','Multiplying','Negative numbers','Order of operations','Powers and roots',
    'Pythagorean theorem','Ratios and percent','Reading between the lines','Statistics','Volume',
    'Word meanings'];
  // The two separators: the ASCII "unit" and "record" marks. Nothing a child can type and no
  // skill name can contain one, so no text ever has to be escaped and a callsign with a comma
  // or a bar in it cannot break the code. kit/class.html splits on the same two.
  const US='\u001f', RS='\u001e';
  function reportCodeShort(){
    const rows=allRows(); const sk=skillRollup(rows);
    const played=rows.filter(({d})=>d.date!=='(set by parent)'&&d.date!=='(placed by link)'&&d.date!=='(from code)'&&d.date!=='(from another device)');
    const secs=played.reduce((a,{d})=>a+(d.secs||0),0);
    const last=played.map(({d})=>d.date).sort().pop()||'';
    // How many MISSIONS, not how many runs: a mission played twice is one mission (the time and the
    // skill counts still include both runs).
    const missions=new Set(played.map(({p})=>p.id)).size;
    const head=['2', S.callsign, S.grade, S.betaCode||'', today(), missions, secs, last].join(US);
    const skills=sk.map(r=>{ const i=SKILL_CODES.indexOf(r.skill);
      return [(i<0? '*'+r.skill : String(i)), r.n, r.first, r.help3||0, (S.practised||{})[r.skill]||0].join(US); });
    return 'ODYSSEY2.'+b64u([head].concat(skills).join(RS)); }
  // The square is never allowed to be wider than the screen it is on: a code cropped by the edge
  // of a phone is a code no camera can read. It is drawn in whole blocks, so it steps down in
  // size rather than being squashed, and a narrow window gets a smaller but still square code.
  function drawClassQR(canvas, size){
    if(!window.OdysseyQR) return null;
    const room=Math.max(120, Math.min(size||320, (screen.clientWidth||360)-70));
    try{ return OdysseyQR.toCanvas(canvas, reportCodeShort(), {maxPixels: room}); }
    catch(e){ return null; }
  }
  // Turning an iPad on its side changes how much room there is, so the square is drawn again at
  // the new size rather than left hanging over the edge. The listener takes itself off as soon as
  // the canvas is no longer on the screen, so leaving the page leaves nothing running.
  function liveClassQR(canvas, size){
    const again=()=>{ if(!document.body.contains(canvas)){ window.removeEventListener('resize', again); return; } drawClassQR(canvas, size); };
    window.addEventListener('resize', again);
    return drawClassQR(canvas, size);
  }

  function reportText(rows){
    const sk=skillRollup(rows);
    return ['ODYSSEY report', 'player: '+S.callsign, 'version: '+APP_VERSION+' · content v'+M.version, 'grade: '+S.grade, 'group code: '+(S.betaCode||'(none)'), 'device: '+navigator.userAgent, 'sent: '+new Date().toISOString(), '',
      'MISSIONS (score out of 100: first try in full, after a hint half)', ...rows.map(({k,p,d,again})=>d.date==='(from another device)' ? `${d.date} | ${k.title} | ${p.title} | played on another device, no score here`
        : /^\((set by parent|placed by link|from code)\)$/.test(String(d.date||'')) ? `${d.date} | ${k.title} | ${p.title} | not played here, not scored`
        : `${d.date} | ${k.title} | ${p.title}${again?' (played again)':''} | score ${missionScore(d)==null?'-':missionScore(d)} | reading ${d.recon[0]}/${d.recon[1]} | math ${d.nav[0]}/${d.nav[1]} | directions ${d.orders[0]}/${d.orders[1]} | second looks ${d.retry} | flags ${d.flags||0} | shown ${shownCount(d)} | ${d.secs<60? d.secs+' s' : Math.round(d.secs/60)+' min'}`),
      '', 'MEDALS', ...(M.campaigns.some(k=>tierOf(k)) ? [] : ['none yet']), ...M.campaigns.filter(k=>tierOf(k)).map(k=>`${k.title}: ${tierOf(k)} · finished ${finishedOn((S.badges||{})[k.id])} · ${k.patrols.filter(p=>bestStars(p)>=3).length} of ${k.patrols.length} missions at 3 stars, ${k.patrols.filter(p=>bestStars(p)>=2).length} at 2 or better`),
      '', 'BY SKILL', ...sk.map(r=>`${r.skill}: ${r.n} tries | first try ${r.first} | after hint ${r.retry} | shown ${r.shown} | flagged ${r.flagged} | nudged ${r.nudged} | asked for help ${r.help||0} | full walk-through ${r.help3||0} | practiced ${(S.practised||{})[r.skill]||0} | avg ${r.avg}s`),
      '', 'camp code: '+campCode(), '', 'CLASS CODE (for the teacher\'s class page; carries the callsign, never a name; anyone holding it can read it)', reportCode()].join('\n');
  }
  function feedbackText(note){ return ['ODYSSEY feedback', 'version: '+APP_VERSION+' · content v'+M.version, 'group code: '+(S.betaCode||'(none)'), 'device: '+navigator.userAgent, 'sent: '+new Date().toISOString(), '', 'FROM YOU', note||'(write here)', '', 'ERRORS (anonymous, last '+S.errors.length+')', ...S.errors.map(e=>`${e.t} ${e.kind} ${e.msg} @ ${e.where} [${e.campaign} ${e.screen}]`)].join('\n'); }
  // NO navigator.share HERE, on purpose. The share sheet carries no recipient, so on every phone and tablet this sent feedback to nobody while telling the parent "Shared." Two days of the beta produced zero mail because of it. sendReport below DOES share, correctly: there the parent chooses who gets it. Here there is one intended reader, so the address must be in the link. Fixed 3 Sep 2026.
  // On the web, Settings is a screen a child can reach, and Feedback opens the device's own mail
  // account. So a grown-up question comes first there, as the app's native gate does for every
  // way out (Kids Category review, 1 October 2026). The app never asks here: its shell gates the
  // mail link itself.
  // Once a parent code exists, the code is the door here, not the arithmetic question: a child can
  // work out a sum, but not four digits a grown-up chose (Adam, 24 Oct 2026). The question stays only
  // for a device with no code yet. The note survives the trip through the code screen.
  async function sendFeedback(note){
    if(EDITION!=='app' && C.parentPin && !S.parentOk){
      renderParentGate(()=>{ renderSettings(); const n=document.getElementById('fbNote'); if(n) n.value=note||'';
        const m=document.getElementById('fbMsg'); if(m) m.textContent='Unlocked. Tap Send feedback.'; focusSettingsCard('Feedback'); }, 'to send feedback');
      return ''; }
    if(EDITION!=='app' && !C.parentPin){ const Q=grownUpQuestion(); const a=prompt('A grown-up question first. '+Q.text);
      if(a===null) return 'Canceled.'; if(Number(String(a).replace(/[^\d]/g,''))!==Q.answer) return 'That is not the answer, so nothing was sent.'; }
    const text=feedbackText(note); const subject='Odyssey feedback '+(S.betaCode?('['+S.betaCode+']'):'');
    location.href='mailto:'+REPORT_TO+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(text);
    // In the app the native "Ask a grown-up" sheet comes next and may be canceled, so promise nothing (audit 4).
    return EDITION==='app' ? 'A grown-up question comes next.' : 'Opening Mail…'; }
  async function sendReport(rows){
    const text=reportText(rows); const subject='Odyssey report for '+S.callsign;
    if(appShare(text, subject)){ reportShareOut = true; return 'Opening the share sheet…'; }
    if(navigator.share){ try{ await navigator.share({title:subject, text}); reportShared(); return 'Shared.'; }catch(e){ if(e && e.name==='AbortError') return 'Canceled.'; } }
    // A mail link cannot carry a long report: desktop mail handlers cut or refuse long bodies, and
    // the class code at the end is the first thing lost (parent audit, 17 Oct 2026). Copy it instead.
    if(text.length>6000){ const ok=await copyText(text); if(ok) reportShared();
      return ok ? 'This report is too long for a mail link. It is copied: open Mail and paste it into a new message.' : 'This report is too long for a mail link. Use Copy as text and paste it into a new message.'; }
    location.href='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(text);
    return 'Opening Mail…';
  }
  // One line per question, in the order the child met them: what was asked, how it went, and —
  // when it did not go right the first time — what he answered and what the answer was. Parents
  // asked to see the day's questions and which ones went which way, not only the tallies (Adam,
  // 16 September 2026). Three rules it is written to: it is folded away, so the report still reads
  // as numbers first; it is factual and not a scolding, because a wrong answer is a place to help,
  // not a verdict; and it stays behind the parent code and on the device, like the rest.
  const LEG_NAME={recon:'Reading', nav:'Math', orders:'Directions', extra:'Bonus'};
  function questionsHtml(d){
    const all=(d.tasks||[]).filter(t=>t && t.q);
    if(!all.length) return '';
    // The bonus round does not change the score or the stars, so it is not in the count above the
    // list either: "9 right on the first try" has to agree with the card it sits under. Its
    // questions follow the mission's own, under their own heading.
    const qs=all.filter(t=>t.leg!=='extra'), bonus=all.filter(t=>t.leg==='extra');
    const first=qs.filter(t=>t.result==='first').length;
    const line=t=>{
          const cls = t.result==='first' ? 'ok' : (t.result==='retry' ? 'half' : 'no');
          const mark = t.result==='shown' ? '✗' : '✓';
          const how = t.result==='first' ? 'Right, first try'
                    : t.result==='retry' ? 'Right, after a hint'
                    : 'Answer shown';
          const wrong = (t.tries||[]).filter(x=>x && x!==t.correct);
          const said = t.result==='first' ? ''
            : (wrong.length ? ` Answered ${wrong.map(x=>'<b>'+esc(x)+'</b>').join(', then ')}.` : '')
              + ` The answer is <b>${esc(t.correct)}</b>.`;
          return `<li class="rq ${cls}"><span class="mark" aria-hidden="true">${mark}</span>`
            + `<span><span class="rqleg">${esc(LEG_NAME[t.leg]||t.leg)}${t.flagged?' · set aside, came back to it':''}</span><br>`
            + `<span class="rqq">${esc(t.q)}</span>`
            + ((t.steps&&t.steps.length)?`<ol class="rqsteps">${t.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'')
            + `</span>`
            + `<span class="rqa">${how}.${said}</span></li>`;
        };
    return `<details class="rqs"><summary>${qs.length===1?'See the question':'See the '+qs.length+' questions'} — ${first} right on the first try</summary><ul class="rqlist">`
      + qs.map(line).join('') + `</ul>`
      + (bonus.length ? `<h4 class="rqhead">${esc(legName('extra'))}</h4><ul class="rqlist">${bonus.map(line).join('')}</ul>` : '')
      + `</details>`;
  }
  // Every way off the report goes through go() (the tab bar, Lock); the ones that reload the page
  // (Undo, Start over, Remove) are covered by save() writing reportHome as the current player.
  function leaveReport(){ const h=reportHome; reportHome=null;
    if(h && h!==C.current && C.profiles[h]){ switchTo(h); save(); climberPos=null; drawScene(); } }
  function markCutTables(){ screen.querySelectorAll('.scrollx').forEach(w=>{ const t=w.querySelector('table'); w.classList.toggle('cut', !!t && t.scrollWidth>w.clientWidth+2); }); }
  window.addEventListener('resize', ()=>setTimeout(markCutTables, 200));
  function renderReport(){
    reportShareOut = false;   // a share sheet the shell never showed must not count later (Fable, 25 Oct 2026)
    if(!S.parentOk){ renderParentGate(undefined, undefined, true); return; }
    say(null, 'Field report. This is the log. Numbers, not opinions.');
    const rows=allRows();
    let h=`<div class="card"><h1 class="tag">Field report</h1><h2>${esc(S.callsign)}</h2>${profileNames().length>1?`<p class="dim">Players on this device: ${profileNames().map(n=>`<button type="button" class="btn small ${n===C.current?'primary':''}" data-child="${esc(n)}">${esc(n)}</button>`).join(' ')}</p>`:''}`;
    if(!rows.length){ h+=`<p class="muted">Nothing logged on this device yet.</p>`; }
    // The report reads day by day, one card per mission, newest first, with a key above it. A
    // parent asked for something easier to read than one wide table (Adam, September 16, 2026:
    // cells or lines, a key to what the numbers are, day by day rather than overall). The whole
    // table still goes out in the text form and the class code, unchanged.
    h+=`<div class="rkey"><h3>How to read this</h3><dl>
      <dt>Score</dt><dd>Out of 100 for that mission. A first-try answer counts in full, an answer after a hint counts half, an answer that had to be shown counts nothing.</dd>
      <dt>Reading · Math · Directions</dt><dd>Right answers out of the questions asked, for each of the mission's three legs.</dd>
      <dt>After a hint</dt><dd>Answered right on the second look, after a hint.</dd>
      <dt>Flagged · shown</dt><dd>Flagged: set aside and answered at the end. Shown: the answer had to be revealed, after two misses or a second flag.</dd>
      <dt>Time</dt><dd>From the first question to the last of that run.</dd>
      <dt>The questions</dt><dd>Open "See the questions" on any day to read that day's questions in the order they were asked, with what was answered and what the answer was.</dd></dl>
      <p class="dim">A mission played again gets its own day here, marked "played again", and the first run stays where it was — so you can see both, and the change between them. Neither one overwrites the other, and the stars and the medal always follow the best run.</p></div>`;
    if(rows.length) h+=`<h3 style="margin-top:16px">Day by day</h3>`;
    rows.slice().reverse().forEach(({k,p,d,again})=>{
      if(d.date==='(set by parent)'||d.date==='(placed by link)'||d.date==='(from code)'||d.date==='(from another device)'){
        // Two different things, and the difference matters to a parent reading this. A camp code or
        // a parent marks a mission done that nobody played. A mission that arrived from the other
        // house WAS played — the questions simply stayed on the device they were answered on. Saying
        // "not played" about a week a child actually did would be a small lie in the one document
        // that is supposed to be straight with them.
        const elsewhere = d.date==='(from another device)';
        h+=`<div class="rday"><div class="rhead"><span class="dim">${esc(elsewhere?'another device':d.date.replace(/[()]/g,''))}</span><b>${esc(k.title)}</b><span>${esc(p.title)}</span></div><p class="dim" style="margin:6px 0 0">${elsewhere?'Played on another device, and the stars came across with it. The questions stayed there, so there is no score to show here.':'Not scored: marked done without playing it here.'}</p></div>`; return; }
      const sc=missionScore(d);
      // "again" marks the replay row. The first row of a replayed mission says so too, so the two
      // are not read as one day contradicting another.
      const note = again ? ' <span class="dim">(played again)</span>'
                 : ((d.attempts||1)>1 ? ' <span class="dim">(first of '+d.attempts+' attempts)</span>' : '');
      h+=`<div class="rday"><div class="rhead"><span class="dim">${d.date}</span><b>${esc(k.title)}</b><span>${esc(p.title)}${note}</span></div>
        <div class="rgrid">
          <div class="rcell rscore"><span class="rl">Score</span><span class="rv">${sc==null?'—':sc}</span><span class="rl">out of 100</span></div>
          <div class="rcell"><span class="rl">Reading</span><span class="rv">${d.recon[0]}<small>/${d.recon[1]}</small></span></div>
          <div class="rcell"><span class="rl">Math</span><span class="rv">${d.nav[0]}<small>/${d.nav[1]}</small></span></div>
          <div class="rcell"><span class="rl">Directions</span><span class="rv">${d.orders[0]}<small>/${d.orders[1]}</small></span></div>
          <div class="rcell"><span class="rl">After a hint</span><span class="rv">${d.retry}</span></div>

  // The same question the native shell puts in its "Ask a grown-up" sheet, in the same two shapes:
  // a two-digit number times a one-digit number, or two three-digit numbers added, drawn fresh every
  // time. Deliberately NOT two-digit addition: this game teaches that to nine-to-eleven-year-olds all
  // week, so a gate built on it guards nothing (guidelines 1.3 and 5.1.4). The easy multipliers and
  // the round tens are left out for the same reason. Kept in step with GateQuestion.fresh() in
  // app/BaseCamp/BaseCampApp.swift, so a parent meets one shape of question, not two.
  function grownUpQuestion(){
    if(Math.random()<0.5){
      let a=13+Math.floor(Math.random()*37); if(a%10===0) a+=1+Math.floor(Math.random()*9);
      const b=[3,4,6,7,8,9][Math.floor(Math.random()*6)];
      return {text:'What is '+a+' \u00d7 '+b+'?', answer:a*b};
    }
    const a=137+Math.floor(Math.random()*762), b=137+Math.floor(Math.random()*762);
    return {text:'What is '+a+' + '+b+'?', answer:a+b};

  // question a grown-up reaches for a calculator to answer: four digits times three, well past
  // anything this game teaches. The reset stays immediate (Adam, 24 Oct 2026: a delay "could be
  // awful" for a family that really forgot). Commas and spaces in the answer are ignored.
  function hardGrownUpQuestion(){
    const a=1237+Math.floor(Math.random()*8651), b=213+Math.floor(Math.random()*775);
    return {text:'What is '+a.toLocaleString('en-US')+' \u00d7 '+b+'?', answer:a*b};

  // `next` is what happens once the code is right; `why` is the one line saying what it opens,
  // because a box that asks for a code without saying what it is for is a box people distrust.
  //
  // `spending` closes the hole in the middle of the first purchase: the code is a real gate only
  // AFTER a parent has set one, and on a new device nobody has. A child who reached the buy button

  function renderParentGate(next, why, spending){

  function summaryLines(sk){

    const rate=r=>r.n? Math.round(100*r.first/r.n):0;
    const label=r=>{ const p=rate(r); return p>=85?'strong':(p>=70?'solid':'working on it'); };
    const rows=sk.map(r=>({...r,p:rate(r),l:label(r)})).sort((a,b)=>a.p-b.p);
    const soft=rows.filter(r=>r.l==='working on it' && r.n>=3); const strong=rows.filter(r=>r.l==='strong' && r.n>=3);
    let out=`<div class="lesson" style="border-left-color:var(--amber)"><h3 style="color:var(--amber)">Plain-English read</h3><ul>`;
    out+= soft.length ? `<li><b>Where the ground is soft:</b> ${soft.map(r=>`${esc(r.skill)} (${r.p}% first try)`).join(', ')}. The next pack should teach these twice before testing them.</li>` : `<li>No skill with three or more tries is below 70% first-try yet.</li>`;
    out+= strong.length ? `<li><b>Strong:</b> ${strong.map(r=>`${esc(r.skill)} (${r.p}%)`).join(', ')}.</li>` : '';
    const nud=sk.reduce((a,r)=>a+r.nudged,0), n=sk.reduce((a,r)=>a+r.n,0);
    out+=`<li><b>Nudges:</b> ${nud} of ${n} tasks had a pause of ${Math.round(IDLE1/1000)} seconds or more before an answer.</li>`;
    const walk=sk.filter(r=>r.help3).sort((a,b)=>b.help3-a.help3); if(walk.length) out+=`<li><b>Went to the full walk-through:</b> ${walk.map(r=>`${r.help3} time${r.help3>1?'s':''} on ${esc(r.skill)}`).join(', ')}. Asking is a good sign; the skill it lands on is the one to teach next.</li>`;
    const pr=Object.entries(S.practised||{}).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]); if(pr.length) out+=`<li><b>Practice tent, on their own time:</b> ${pr.map(([k,v])=>`${esc(k)} ×${v}`).join(', ')}. Practice is never scored.</li>`;
    if(soft.length) out+=`<li><b>Bonus rounds:</b> each new mission now adds one or two extra items on ${soft.slice(0,2).map(r=>esc(r.skill)).join(' and ')}, drawn from ground already covered. That is the whole of the adapting: the record steers the draw. Nothing is sent anywhere and there is no model behind it.</li>`;
    const fks=M.campaigns.filter(k=>k.patrols.some(p=>S.done[p.id])).map(k=>k.readingLevel&&k.readingLevel.fk).filter(x=>typeof x==='number');
    out+=`<li><b>Grade setting:</b> ${esc(S.grade)}. Math sets follow the grade; reading passages are shared across nearby grades.</li>`;
    if(fks.length){ const lo=Math.round(Math.min(...fks)), hi=Math.round(Math.max(...fks)); const band=lo===hi?`grade ${lo}`:`grade ${lo} to ${hi}`;
      out+=`<li><b>Reading level:</b> Passages read at about ${band} by the Flesch-Kincaid measure, and they are the same passages at every grade. A skill marked strong here is ready for the next notch.</li>`; }
    out+=`<li class="dim">These are first-try rates on the packs given so far, at the level being taught. They are a signal for the next pack, not a score of the player. Nothing here is an IQ or a grade.</li></ul></div>`;
    return out;
  }

  // ---------------- settings / camp code ----------------
  function campCode(){ const c=camp(); const bits=c.patrols.map(p=>S.done[p.id]?'1':'0').join('')||'0'; return `${c.id.toUpperCase()}-${bits}-${liveStreak()}`; }
  function applyCode(code){
    if(/^\s*ODY\d/i.test(String(code))) return 'That is a code for Moving to another device. Paste it in that box, just below.';
    const m=String(code).trim().toUpperCase().match(/^([A-Z0-9]+)-([01]+)-(\d+)$/); if(!m) return 'That code does not look right.';
    const k=M.campaigns.find(x=>x.id.toUpperCase()===m[1]); if(!k) return 'No campaign with that name in this kit.';
    if(wouldLock(k)) return EDITION!=='app' ? 'That adventure is in the Odyssey app. Add this code in the app and it comes across there.'
                                    : 'That adventure is part of the year, which is not unlocked on this device yet.';
    S.campaign=k.id; S.arrived[k.id]=true; k.patrols.forEach((p,i)=>{ if(m[2][i]==='1' && !S.done[p.id]) S.done[p.id]={date:'(from code)', attempts:0, campaign:k.id, recon:[0,0], nav:[0,0], orders:[0,0], retry:0, flags:0, unanswered:0, secs:0, tasks:[]}; });
    S.streak=Math.max(S.streak, Number(m[3])); save(); climberPos=null; drawScene(); return 'Camp code applied.'; }

  // ---------------- the resume code: a year of progress, carried between two homes ----------------
  // WHY THIS EXISTS, AND WHY THE CLASS CODE CANNOT DO IT. A child who plays a week here and a week
  // at their other parent's house should not start again on either machine. The class code is a
  // REPORT: it travels one way, to a teacher, and it deliberately carries no score at all. This
  // code travels the other way — INTO a save — so it carries the only things a medal is made of.
  //
  // WHY IT IS SMALL ENOUGH TO TYPE. Not because anything was thrown away, but because progress and
  // records are already separate things in this file: S.stars and S.tiers survive a "Do it again"
  // that wipes the day's questions, because a medal is not allowed to go down. So the payload is
  // two bits a mission, not a year of question text — about seventy bytes for all of it, which is a
  // long password rather than a wall. The square is the real mechanism; typing is the fallback.
  //
  // ⚠️ IT MERGES. IT NEVER REPLACES, AND THAT IS THE WHOLE SAFETY OF IT. With alternating weeks a
  // code that overwrote the save would destroy the other household's week EVERY time it was used,
  // in both directions, and it would present as the game losing a child's work. Every write below
  // goes one way only: a mission done on either machine stays done, the better star count wins, a
  // medal never goes down, the longer streak survives. That is not a new rule — it is what
  // applyCode, recordStars and refreshTier already do, which is why this is safe to build out of
  // them rather than beside them.
  //
  // WHAT IT DELIBERATELY DOES NOT CARRY: the callsign. The receiving device already has a name the
  // child typed there, and a name traveling between two houses is the one thing this project does
  // not do. Progress lands in whichever profile is open.
  //
  // THE HONEST COST, WHICH IS NOT HIDDEN ANYWHERE: a mission that arrives by code has no questions
  // in it, so the parent report on the receiving device shows no score for that day. The stars and
  // the medal are right; what the child actually answered is not there. A score is never invented
  // to make the report look complete. It is marked "(from another device)" rather than reusing the
  // camp code's "(from code)", because those are different facts: a camp code marks a mission
  // nobody played, and this is a mission the child really did, somewhere else.
  const R32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';   // Crockford base32: no I, L, O or U to mistype
  const RESUME_TAG='ODY1';                        // the format, not the app version. Bump to ODY2
                                                  // if the meaning of any field below ever changes.
  function r32enc(by){ let out='', acc=0, n=0;
    for(const b of by){ acc=(acc<<8)|b; n+=8; while(n>=5){ out+=R32[(acc>>(n-5))&31]; n-=5; } }
    if(n) out+=R32[(acc<<(5-n))&31];
    return out; }
  function r32dec(str){ // O/0 and I/L/1 are the pairs a person actually mistypes, so they are taken
    const clean=String(str).toUpperCase().replace(/O/g,'0').replace(/[IL]/g,'1').replace(/[^0-9A-Z]/g,'');
    const by=[]; let acc=0, n=0;
    for(const ch of clean){ const v=R32.indexOf(ch); if(v<0) return null;
      acc=(acc<<5)|v; n+=5; if(n>=8){ by.push((acc>>(n-8))&255); n-=8; } }
    return by; }
  function crc16(by){ let c=0xffff;                 // CRC-16/CCITT. A mistyped code must be refused,
    for(const b of by){ c^=(b<<8);                  // never half-applied to a child's save.
      for(let i=0;i<8;i++) c = (c&0x8000) ? ((c<<1)^0x1021)&0xffff : (c<<1)&0xffff; }
    return c; }
  function bitsOut(){ const by=[]; let acc=0, n=0;
    return { put(v,w){ for(let i=w-1;i>=0;i--){ acc=(acc<<1)|((v>>i)&1); if(++n===8){ by.push(acc); acc=0; n=0; } } },
             done(){ if(n) by.push(acc<<(8-n)); return by; } }; }
  function bitsIn(by){ let i=0, n=0;
    return { get(w){ let v=0; for(let k=0;k<w;k++){ const b=(i<by.length?by[i]:0); v=(v<<1)|((b>>(7-n))&1);
               if(++n===8){ n=0; i++; } } return v; },
             bitsLeft(){ return Math.max(0,(by.length-i)*8-n); } }; }
  // The campaigns of the school year, in the order the mission index lists them.
  function resumeCamps(){ return baseCampaigns().filter(k=>k.patrols && k.patrols.length); }
  // A fingerprint of the content itself, not a version number someone has to remember to bump. If
  // the two devices disagree about what the year contains, the bit stream below means different
  // things on each and the code is refused rather than applied to the wrong missions.
  function contentPrint(){ let h=0x811c9dc5>>>0;
    resumeCamps().forEach(k=>k.patrols.forEach(p=>{
      for(let i=0;i<p.id.length;i++){ h=(h^p.id.charCodeAt(i))>>>0; h=Math.imul(h,16777619)>>>0; } }));
    return h & 0xffff; }
  const TIER_N={bronze:1, silver:2, gold:3}, N_TIER=[null,'bronze','silver','gold'];
  function dayNum(d){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d||'')); if(!m) return 0;
    const t=Date.UTC(+m[1], +m[2]-1, +m[3]) - Date.UTC(2020,0,1);
    const n=Math.round(t/86400000); return (n>0 && n<16383) ? n : 0; }
  function numDay(n){ if(!n) return null; const d=new Date(Date.UTC(2020,0,1)+n*86400000);
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }

  function resumeCode(){
    const camps=resumeCamps(), w=bitsOut();
    w.put(contentPrint(), 16);
    w.put(Math.max(0, ALL_GRADES.indexOf(S.grade)), 3);
    w.put(Math.min(1023, liveStreak()|0), 10);
    w.put(dayNum(S.lastDay), 14);
    w.put(Math.max(0, camps.findIndex(k=>k.id===S.campaign)), 6);
    // A mission a parent marked done ("set by parent") or a link placed ("placed by link") was not
    // played, so it travels as not done: on the other device it would otherwise arrive as "from
    // another device", which counts as played and which the parent's clear tool cannot remove
    // (data-integrity audit, 1 October 2026). A replayed one carries its real play in .latest.
    const marked=p=>{ const r=S.done[p.id]; return !!r && !r.latest && (r.date==='(set by parent)' || r.date==='(placed by link)' || r.date==='(from code)') && !((S.stars||{})[p.id]>1); };
    camps.forEach(k=>k.patrols.forEach(p=>w.put(marked(p) ? 0 : Math.min(3, bestStars(p)|0), 2)));
    camps.forEach(k=>w.put(TIER_N[tierOf(k)]||0, 2));
    camps.forEach(k=>w.put((S.badges||{})[k.id]?1:0, 1));
    const by=w.done(), c=crc16(by); by.push(c>>8, c&255);
    const s=r32enc(by);
    return RESUME_TAG+'-'+(s.match(/.{1,5}/g)||[]).join('-');   // groups of five, to read aloud
  }

  // Returns a plain sentence for a person, always. It never throws and it never applies half a code.
  function applyResumeCode(str){
    const raw=String(str||'').trim();
    if(!raw) return 'Type or paste the code from the other device.';
    if(/^[A-Z0-9]+-[01]+-\d+$/i.test(raw)) return 'That is a camp code. Put it in the Camp code box just above.';
    // A code arrives from a message, so it arrives with whatever came with it: quotation marks from
    // a quoted reply, "here you go" in front of it, a line break where the message wrapped, spaces
    // where the hyphens were. None of that is the parent's mistake and none of it changes the code,
    // so the code is FOUND in what was pasted rather than demanded at the start of it. I and L are
    // folded to 1 first (they are not in the alphabet, so they can only be a mistyped one) which
    // also rescues a tag typed as ODYl.
    const up=raw.toUpperCase().replace(/[IL]/g,'1');
    const m=up.match(/ODY(\d+)([\s\S]*)$/);
    if(!m) return 'That does not look like a code from Odyssey. Nothing was changed.';
    if(m[1]!==RESUME_TAG.slice(3)) return 'That code is from a newer version of Odyssey. Update this device, then make a new code. Nothing was changed.';
    const by=r32dec(m[2]);
    if(!by || by.length<4) return 'That code does not look right. Nothing was changed.';
    const c=by.slice(-2), body=by.slice(0,-2);
    if(((c[0]<<8)|c[1])!==crc16(body)) return 'That code is incomplete or has a typo in it. Check it and try again — nothing was changed.';
    const camps=resumeCamps(), n=camps.reduce((a,k)=>a+k.patrols.length,0);
    const need=16+3+10+14+6 + n*2 + camps.length*3;
    const r=bitsIn(body);
    if(r.bitsLeft()<need) return 'That code is from a different version of Odyssey. Nothing was changed.';
    if(r.get(16)!==contentPrint()) return 'That code was made by a different version of Odyssey. Update both devices, then make a new code. Nothing was changed.';
    const grade=ALL_GRADES[r.get(3)]||S.grade, streak=r.get(10), day=numDay(r.get(14)), campI=r.get(6);
    const stars=[], tiers=[], badges=[];
    camps.forEach(k=>k.patrols.forEach(()=>stars.push(r.get(2))));
    camps.forEach(()=>tiers.push(r.get(2)));
    camps.forEach(()=>badges.push(r.get(1)));
    // Everything above this line only reads. Nothing below it ever lowers anything.
    const fresh = !Object.keys(S.done||{}).length && !Object.keys(S.stars||{}).length;
    let added=0, raised=0, medals=0, i=0, locked=0;
    S.stars=S.stars||{}; S.tiers=S.tiers||{}; S.badges=S.badges||{}; S.done=S.done||{}; S.arrived=S.arrived||{};
    // An adventure this device cannot open is skipped rather than written in behind the lock. It is
    // the same child's real work, so nothing is refused on principle — but a shelf of medals for
    // adventures that will not open is a confusing screen, and progress written under a lock looks
    // like a way round it. The code is not consumed: unlock, paste the same code again, and the rest
    // comes across. The message below says so rather than leaving a parent to wonder.
    const skip={}; camps.forEach(k=>{ if(wouldLock(k)) skip[k.id]=true; });
    camps.forEach(k=>k.patrols.forEach(p=>{
      const got=stars[i++]; if(!got) return;
      if(skip[k.id]){ if(!S.done[p.id]) locked++; return; }
      if(!S.done[p.id]){ added++; S.arrived[k.id]=true;
        S.done[p.id]={date:'(from another device)', campaign:k.id, recon:[0,0], nav:[0,0], orders:[0,0], retry:0, flags:0, unanswered:0, secs:0, tasks:[]}; }
      if(!(S.stars[p.id]>=got)){ if(S.stars[p.id]) raised++; S.stars[p.id]=got; } }));
    camps.forEach((k,j)=>{ if(skip[k.id]) return; const t=N_TIER[tiers[j]];
      if(t && TIERS.indexOf(t)>TIERS.indexOf(S.tiers[k.id]||null)){ S.tiers[k.id]=t; medals++; }
      if(badges[j] && !S.badges[k.id]) S.badges[k.id]=true; });
    if(streak>S.streak) S.streak=streak;
    if(day && (!S.lastDay || day>S.lastDay)) S.lastDay=day;
    // A grade and a current adventure are settings on THIS device, and a child may be mid-adventure
    // here. They are taken only when this device has nothing of its own to lose.
    if(fresh){ S.grade=grade; delete S.gradeWanted; const k=camps[campI]; if(k && !wouldLock(k)) S.campaign=k.id; }
    const kept=save(); climberPos=null; fillMedals(); drawScene();
    const held = !locked ? '' : EDITION!=='app'
      ? ' '+(locked===1?'1 mission is':locked+' missions are')+' in adventures that are in the Odyssey app \u2014 add this same code in the app and they come across there.'
      : ' '+(locked===1?'1 mission is':locked+' missions are')+' waiting on adventures this device has not unlocked \u2014 unlock the year, then add this same code again and they will come across too.';
    if(!added && !raised && !medals) return (locked ? 'Nothing was added.'+held : 'Nothing new in that code — this device is already up to date. Nothing was changed.');
    const bits=[];
    if(added) bits.push(added===1?'1 mission':added+' missions');
    if(raised) bits.push(raised===1?'1 better score':raised+' better scores');
    if(medals) bits.push(medals===1?'1 medal':medals+' medals');
    return 'Added '+bits.join(', ')+' from the other device. Nothing was replaced.'+held+(kept?'':NOT_KEPT); }

  // ---------------- showing the class code to a teacher ----------------
  // A cart of school laptops is the reason this exists. The teacher walks the row with her phone
  // and reads each screen; the child has to be able to put the square up himself, and he does not
  // know the parent code and should not. So this is in front of the parent code, and it shows two
  // things and nothing else: the callsign he chose, and the square. NO report, no scores, no
  // percentages — a screen that shows a child his numbers while a grown-up leans over it is a
  // screen that can be read by whoever is at the next desk. The square is not readable by eye.
  function renderClassCode(){
    say(null, 'Hold it up.');
    screen.innerHTML=`<div class="card"><span class="tag">For your teacher</span>
      <h2>${esc(S.callsign)}</h2>
      <p class="muted">Hold the screen up so your teacher can point her phone at the square. That is all it is for.</p>
      <div style="background:#fff;display:inline-block;padding:14px;border-radius:14px;margin:6px 0">
        <canvas id="qrBig" style="max-width:100%;display:block" role="img" aria-label="Class code for ${esc(S.callsign)}, as a square for a teacher to scan"></canvas></div>
      <p class="dim" id="qrBigNote">It holds your callsign and how you have been doing — the same numbers as the report. It does not hold your name, and nothing is sent anywhere.</p>
      <div class="row" style="margin-top:10px"><button type="button" class="btn primary" id="qrDone">Done</button></div></div>`;
    const c=document.getElementById('qrBig');
    if(!liveClassQR(c, 340)){ c.style.display='none'; document.getElementById('qrBigNote').textContent='The square could not be drawn on this device. A grown-up can copy the class code from the Parent tab instead.'; }
    const done=document.getElementById('qrDone');
    // Escape closes it too. The handler takes itself off again the moment it fires or the screen
    // is left, so repeated visits cannot stack up handlers that fire on a later screen.
    // (Leaving by a tab used to leave it behind, and a later Escape put Settings over a mission;
    // go() now takes it off, and it checks its own screen is still showing. Engine audit, 23 Oct 2026.)
    const back=()=>{ document.removeEventListener('keydown', esckey); renderSettings(); focusBack(document.getElementById('showClassCode')); };
    const esckey=ev=>{ if(ev.key!=='Escape') return; if(document.body.contains(done)) back(); else document.removeEventListener('keydown', esckey); };
    document.addEventListener('keydown', esckey); dropScreenKey(); screenKeyOff=()=>document.removeEventListener('keydown', esckey);
    done.onclick=back;
    takeFocus(done);
  }

  // Copying, with the honest fallback. A refused clipboard is common on iOS in a web view, and a
  // parent who is told "Copied." when nothing was copied loses the code and their temper.
  async function copyText(t){ try{ await navigator.clipboard.writeText(t); return true; }
    catch(e){ try{ prompt('Copy this:', t); return true; }catch(e2){ return false; } } }

  // ⚠️ NO SQUARE HERE, AND THE REASON MATTERS. This screen shows the code as text on purpose.
  // Odyssey can DRAW a square (qr.js, for the teacher to scan off a child's screen) but nothing in
  // it can READ one: the scanner lives in class.html, it is fetched only on the web, and the app
  // deliberately carries no camera code at all — the release check FAILS the build if any gets in.
  // So a square here would be a picture nobody on the receiving end could do anything with. What a
  // parent at a handover will actually do is send the code in a message, so that is what this
  // screen is built around.
  function renderResumeCode(){
    const code=resumeCode();
    const camps=resumeCamps();
    const done=camps.reduce((a,k)=>a+k.patrols.filter(p=>bestStars(p)>0).length,0);
    const medals=camps.filter(k=>tierOf(k)).length;
    // Nothing to carry is not an error, but handing over a code that holds nothing wastes a
    // parent's time twice: once typing it and once wondering why the other device said no.
    if(!done){
      say(null, 'Nothing to carry yet.');
      screen.innerHTML=`<div class="card"><span class="tag">For the other device</span>
        <h2>Nothing to carry across yet</h2>
        <p class="muted">A code carries finished missions, and ${esc(S.callsign)} has not finished one on this device yet. Play a mission here first, then come back — or, if the work is on the OTHER device, make the code there and paste it in here instead.</p>
        <div class="row" style="margin-top:10px"><button type="button" class="btn primary" id="rcDone">Done</button></div></div>`;
      const b=document.getElementById('rcDone'); b.onclick=()=>{ renderSettings(); focusBack(document.getElementById('showResume')); }; takeFocus(b); return; }
    say(null, 'Here it is.');
    screen.innerHTML=`<div class="card"><span class="tag">For the other device</span>
      <h2>${esc(S.callsign)}'s code</h2>
      <p class="muted">This is ${done===1?'1 mission':done+' missions'}${medals?' and '+(medals===1?'1 medal':medals+' medals'):''}, packed small. Send it to the other device, or type it in there by hand. <b>It only adds — nothing there is replaced.</b></p>
      <div class="big" style="font-size:calc(20px * var(--ts, 1));line-height:1.7;font-family:ui-monospace,Menlo,monospace;word-break:break-all;margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0c1730" id="rcodeText">${esc(code)}</div>
      <div class="row" style="margin-bottom:8px"><button type="button" class="btn small primary" id="rcCopy">Copy it</button>${nativeShare||navigator.share?'<button type="button" class="btn small" id="rcSend">Send it</button>':''}<span class="dim" id="rcMsg" role="status"></span></div>
      <p class="dim">On the other device: Settings, then <b>Moving to another device</b>, and paste it into the box. It carries no name — whoever is playing on that device keeps their own callsign.</p>
      <div class="row" style="margin-top:10px"><button type="button" class="btn primary" id="rcDone">Done</button></div></div>`;
    document.getElementById('rcCopy').onclick=async()=>{
      document.getElementById('rcMsg').textContent = (await copyText(code)) ? 'Copied.' : 'Could not copy — read it from the box above.'; };
    const send=document.getElementById('rcSend');
    if(send) send.onclick=async()=>{ const subject='Odyssey code for the other device';
      if(appShare(code, subject)){ document.getElementById('rcMsg').textContent='Opening the share sheet…'; return; }
      if(navigator.share){ try{ await navigator.share({title:subject, text:code}); document.getElementById('rcMsg').textContent='Sent.'; }
        catch(e){ if(!(e && e.name==='AbortError')) document.getElementById('rcMsg').textContent='Could not open the share sheet.'; } } };
    const d=document.getElementById('rcDone');
    const back=()=>{ document.removeEventListener('keydown', esckey); renderSettings(); focusBack(document.getElementById('showResume')); };
    const esckey=ev=>{ if(ev.key!=='Escape') return; if(document.body.contains(d)) back(); else document.removeEventListener('keydown', esckey); };   // see renderClassCode
    document.addEventListener('keydown', esckey); dropScreenKey(); screenKeyOff=()=>document.removeEventListener('keydown', esckey);
    d.onclick=back;
    takeFocus(d);
  }

  // Focus a Settings card's heading by its words, after Settings has been drawn again.
  function focusSettingsCard(title){ const h=[...screen.querySelectorAll('.card h2')].find(x=>x.textContent.trim()===title); focusBack(h); }
  function renderSettings(){
    say(null, 'Gear check.');
    let h=`<div class="card"><h1 class="tag">Settings</h1><h2>Callsign</h2><p class="muted">What ${esc(M.companion.name)} calls you. First name, nickname, or a rank. Not a full name.</p>
      <div class="answer"><input id="cs" type="text" autocomplete="nickname" aria-label="Callsign" maxlength="20" value="${esc(S.callsign)}"><button type="button" class="btn primary" id="csBtn">Save</button></div></div>`;
    h+=`<div class="card"><h2>Camp code</h2><p class="muted">This code carries the adventure in progress. To move the whole year, use <b>Moving to another device</b>, just below.</p>

  // ---------------- school license: reading and checking the key ----------------
  // The arithmetic — the public key, SHA-512, Ed25519, the token format and the four states — is
  // in license-check.js, because kit/class.html needs exactly the same check and a printout that
  // verifies its own key is worth more than a second copy of the same hundred lines. These are
  // those functions, under the names the rest of this page already uses.
  const licMonthDay=LICLIB.monthDay, licLongDate=LICLIB.longDate, licLine=LICLIB.line;
  const licCheck=LICLIB.check, licSecondOpinion=LICLIB.secondOpinion;
  const LIC_BAD_SIG=LICLIB.BAD_SIG, LIC_NO_STORE=LICLIB.NO_STORE;
  // The four states, worked out against KIT_BUILD: a device whose clock reads earlier than the day
  // this copy was built is a device whose clock cannot be trusted, and a wrong clock never takes
  // the game away from a child. The rule lives in license-check.js; the build date is this page's,
  // and it is the only thing this page still has to tell it.
  function licState(p){ return LICLIB.state(p, KIT_BUILD); }
  function licLoad(){
    let tok=null; try{ tok=localStorage.getItem(LIC_STORE); }catch(e){}
    if(!tok) { try{ localStorage.removeItem(LIC_LINE_STORE); }catch(e){} return null; }
    const r=licCheck(tok);
    if(!r.ok){ try{ localStorage.removeItem(LIC_LINE_STORE); }catch(e){} return null; }
    return licFromPayload(r.payload);
  }
  // LIC for a key whose signature has already verified. Shared by licLoad and by the two places a
  // key arrives, so a browser that refuses to store the key still honors it for this visit — which
  // is what "paste it each time" promises the adult.
  function licFromPayload(p){
    const st=licState(p), line=licLine(p);
    // The class page prints this line and does not carry a copy of the checking machinery; it is
    // written here, only after this key has verified, and cleared the moment it stops counting.
    // One exception: a clock reading earlier than the day this copy was built keeps the game
    // running (a wrong clock never takes it away) but proves nothing about the license, so that
    // branch writes nothing and erases nothing — whatever line is already there is left alone.
    if(today() >= KIT_BUILD){
      try{ if(st==='active'||st==='grace') localStorage.setItem(LIC_LINE_STORE, line);
           else localStorage.removeItem(LIC_LINE_STORE); }catch(e){}
    }
    return { payload:p, state:st, line:line };
  }
  // What the adult is told, in Settings, after pasting. A child sees none of these.
  function licApply(raw){
    const v=String(raw||'').trim();
    if(!v) return 'Paste the key the school office gave you.';
    const r=licCheck(v);
    if(!r.ok) return r.why;
    let saved=true;
    try{ localStorage.setItem(LIC_STORE, r.token); }catch(e){ saved=false; }
    LIC=licFromPayload(r.payload); LIC_NOTE=null;
    licSecondOpinion(r.decoded).then(agreed=>{
      if(agreed!==false) return;
      try{ localStorage.removeItem(LIC_STORE); localStorage.removeItem(LIC_LINE_STORE); }catch(e){}
      LIC=null; const m=document.getElementById('licMsg'); if(m) m.textContent=LIC_BAD_SIG;
    });
    // The signature already checked out, so a key the browser would not keep is a storage problem,
    // not a forgery: it counts for this visit and the adult is told it will not be remembered.
    if(!saved) return LIC_NO_STORE;
    if(LIC.state==='future') return 'This license begins '+licLongDate(r.payload.start)+'.';
    if(LIC.state==='grace'||LIC.state==='ended')
      return ((r.payload.ed||[]).indexOf('home')>=0?'This license':"This school's license")+' ended '+licMonthDay(r.payload.end)+'. Renewal: '+REPORT_TO+'.';
    return LIC.line;
  }
  // A cart of thirty laptops: the media specialist opens one bookmark on each. The key rides
  // after a "#", never after a "?" — a "?" is sent to the web server and written into its logs,
  // a "#" never leaves the browser — and it is taken back out of the address bar, the same way
  // the ?start= link already does, so later visits and screenshots show the plain address.
  // What this does NOT do, and license.html says so plainly: the browser has already written the
  // visit into its own history by the time this runs (checked on iPadOS Safari, 6 Sep 2026 — the

  function licFromFragment(){
    const m=(location.hash||'').match(/(?:^#|[#&])lic=([A-Za-z0-9._~%-]+)/);
    if(!m) return;

      });
    }
    else LIC_NOTE=r.why;   // waits quietly in Settings for a grown-up; nothing is shown to a child
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  }

  // ---------------- boot ----------------
  // The license is read before anything else: it decides which adventures are open on the web
  // (webTierOn), including for the ?start= link just below, and a key arriving in the address bar
  // is taken out of it so later screenshots show the plain address. The browser's own history
  // keeps the link regardless; see the note on licFromFragment.

  licFromFragment(); if(!LIC) LIC=licLoad();
  (function(){ const m=(location.search||'').match(/[?&]start=([a-z0-9]+):(\d+)/i); if(!m) return; const k=M.campaigns.find(x=>x.id===m[1]); const n=Number(m[2]); if(!k||!k.patrols.length||n<1||n>k.patrols.length) return; if(wouldLock(k)){ history.replaceState(null,'',location.pathname); START_LOCK=k; return; }
    if(confirm('This link starts you at '+k.title+', mission '+n+'. The earlier missions will be marked as skipped, not scored. Start there?')){
      START_PLACED=true; S.campaign=k.id; S.arrived[k.id]=true; S.welcomed=S.welcomed||false; k.patrols.slice(0,n-1).forEach(p=>{ if(!S.done[p.id]) S.done[p.id]={date:'(placed by link)', campaign:k.id, grade:S.grade, recon:[0,0], nav:[0,0], orders:[0,0], retry:0, flags:0, unanswered:0, secs:0, tasks:[], attempts:0}; }); save(); }

  // The shell answers with window.odysseyPrices (localized, from StoreKit) and, at its own pace,

    // fill its content cache in the background: the adventure files first, then the pictures.
    // That is what keeps "works offline after the first visit" true for a whole school year.
    const prefetch=()=>navigator.serviceWorker.ready.then(reg=>{
      const w=navigator.serviceWorker.controller || reg.active; if(!w) return;
      // The medals go first, and their thirty-six emblems with them. A ceremony is the worst
      // possible moment to be waiting on a picture, and all of them together are smaller than
      // two scenes.
      const imgs=[BLANK_MEDAL].concat(TIERS.map(medalSrc)).concat(baseCampaigns().map(k=>emblemSrc(k.id)));
      baseCampaigns().forEach(k=>{ if(k.scene){ imgs.push(k.scene); imgs.push(k.scene.replace('scene-','thumb-').replace(/\.png$/,'.jpg')); } });
      Object.keys(M.companion.forms||{}).forEach(n=>{ const f=M.companion.forms[n];
        if(f.avatarSrc) imgs.push(f.avatarSrc); if(f.portrait) imgs.push(f.portrait); });
      w.postMessage({ type:'prefetch', files:baseCampaigns().map(k=>k.file).filter(Boolean), images:imgs });
    }).catch(()=>{});
    // On a phone with Low Data Mode or data saver on, today's adventure still loads, but the year's
    // worth of pictures behind it does not: that is somebody's data plan, and they have said so.
    const saveData=!!(navigator.connection && navigator.connection.saveData);
    const kick=()=>loadCampaign(camp().id).catch(()=>{}).then(()=>{ if(!saveData) prefetch(); });
    if('requestIdleCallback' in window) requestIdleCallback(kick, {timeout:8000}); else setTimeout(kick, 4000);
  }
  // Keep the reader's place in a passage when the screen changes shape (a fold, a rotation, a split
  // view). Tall screens scroll the passage in its own box, short ones scroll the page, and two
  // columns scroll the right-hand panel, so after a change the old scroll position belongs to a
  // different scroller and the child lands somewhere else in the text. While they read, remember which
  // paragraph sits at the top of what they can see (and how far into it); after the change, put that
  // spot back at the top. Scrolls caused by the change itself are ignored until the place is restored.
  let readAt=null, reshaping=false;
  function scrollerOf(el){ for(let n=el.parentElement; n && n!==document.body; n=n.parentElement){ const o=getComputedStyle(n).overflowY; if((o==='auto'||o==='scroll') && n.scrollHeight>n.clientHeight+1) return n; } return null; }
  function ownBox(ps){ const o=getComputedStyle(ps).overflowY; return (o==='auto'||o==='scroll') && ps.scrollHeight>ps.clientHeight+1; }
  function readLine(ps){ const outer=scrollerOf(ps); const top=outer ? outer.getBoundingClientRect().top : 0;
    return Math.max(ps.getBoundingClientRect().top, top); }
  function noteReadingPlace(){ if(reshaping) return; const ps=document.querySelector('.passage'); if(!ps){ readAt=null; return; }
    const y=readLine(ps), paras=[...ps.querySelectorAll('p')];
    const i=paras.findIndex(p=>p.getBoundingClientRect().bottom>y); if(i<0) return;
    const r=paras[i].getBoundingClientRect();
    readAt={key:ps.getAttribute('aria-label')+'|'+paras.length, i, f:Math.max(0,Math.min(1,(y-r.top)/Math.max(1,r.height)))}; }
  function restoreReadingPlace(){ const ps=document.querySelector('.passage'), at=readAt; if(!ps || !at) return;
    const paras=[...ps.querySelectorAll('p')]; if(at.key!==ps.getAttribute('aria-label')+'|'+paras.length || !paras[at.i]) return;
    const r=paras[at.i].getBoundingClientRect(), target=r.top+at.f*r.height;
    if(ownBox(ps)){ ps.scrollTop+=target-ps.getBoundingClientRect().top; return; }
    if(at.i===0 && at.f<0.02) return;   // still at the start of the text: leave the page where it is
    const outer=scrollerOf(ps), d=target-(outer ? outer.getBoundingClientRect().top : 0)-8;
    if(outer) outer.scrollTop+=d; else window.scrollBy(0,d); }
  document.addEventListener('scroll', noteReadingPlace, {passive:true, capture:true});
  let rsT=null; window.addEventListener('resize', ()=>{ reshaping=true; clearTimeout(rsT); rsT=setTimeout(()=>{ document.getElementById('mtn').setAttribute('preserveAspectRatio', letterboxed() ? 'xMidYMid meet' : 'xMidYMid slice');
    if(twoColumns()) window.scrollTo(0,0);   // the grid layout never scrolls the document; drop any leftover
    restoreReadingPlace();
    requestAnimationFrame(()=>{ reshaping=false; });
    }, 150); });
  // The same guard, for any scroll that arrives after the switch (a focus moving into view, an iOS
  // scroll view that kept its offset): in the two-column layout the document stays at the top.
  window.addEventListener('scroll', ()=>{ if(twoColumns() && (window.scrollY||window.pageYOffset)) window.scrollTo(0,0); }, {passive:true});
  // The keyboard keeper. In the two-column layout the page itself never scrolls, and iOS only lifts a
  // box above the keyboard by scrolling the page, so on the iPhone Duo's inner screen (951 by 669) and
  // on a phone held sideways the keyboard covered the Orders answer box and the column could not be
  // dragged far enough to show it (Duo audit, 17 Oct 2026). The keyboard does not change the layout's
  // height here; it shrinks only the visual viewport. So while a box in #screen has focus, the part of
  // the column under the keyboard becomes extra room at its bottom (--kb), and if the box is out of
  // sight it is scrolled to the middle of what is still visible. Nothing here changes the size of any
  // layout box, so it cannot set off another resize; desktop and iPad without a software keyboard
  // measure no overlap and are left alone. One column has its own smaller rule (fitColumn, 26 Oct 2026). Pinch zoom also shrinks the visual viewport, so
  // nothing is done while zoomed in.
  (function(){
    const vv=window.visualViewport; if(!vv) return;
    let kb=0, pend=0, capped=null, focusAt=0, padT=0, due=false, dueT=0;
    // A keyboard that floats (the number pad on the Duo's inner screen, 25 Oct 2026) never shrinks the visual viewport, so the box and Check
    // went under it: from 0.6 s after a box takes focus on a touch screen, if only the bar over the keys has shrunk it, the lower 45% counts as covered.
    const touch=window.matchMedia('(pointer: coarse)').matches;
    const typingIn=(sc)=>{ const a=document.activeElement; if(!a || !sc.contains(a)) return null;
      if(a.tagName==='TEXTAREA') return a;
      return a.tagName==='INPUT' && !/^(button|submit|reset|checkbox|radio|range|color|file|image|hidden)$/i.test(a.type) ? a : null; };
    // The box's row (box and Check), or a note box with the whole row after it (Send feedback and the status line under it).
    const span=(f)=>{ const row=f.closest('.answer')||f, nx=row===f && row.nextElementSibling, act=nx && nx.classList.contains('row') && nx.querySelector('button') ? nx : null;
      const fr0=row.getBoundingClientRect(), ar=act ? act.getBoundingClientRect() : fr0;
      return {act, fr0, fr:{top:Math.min(fr0.top, ar.top), bottom:Math.max(fr0.bottom, ar.bottom)}}; };
    // A note box too tall to fit over the keyboard with its Send row shrinks to the room left (one line at least) and scrolls inside.
    function capNote(f, act, fr0, fr, top, bot){
      if(f.tagName!=='TEXTAREA' || !act || fr.bottom-fr.top<=bot-top-16) return;
      const fs=parseFloat(getComputedStyle(f).fontSize)||17;
      f.style.minHeight='0px'; f.style.maxHeight=Math.round(Math.max(fs*1.5+22, (bot-top-16)-(fr.bottom-fr0.bottom)))+'px'; capped=f;
      const nr=f.getBoundingClientRect(), na=act.getBoundingClientRect(); fr.top=nr.top; fr.bottom=na.bottom; }
    function uncap(){ if(capped){ capped.style.maxHeight=capped.style.minHeight=''; capped=null; } }   // the keyboard went: the note box gets its full height back
    // One column (the cover, the inner screen turned, a phone or iPad upright): iOS scrolls the page to the box, but at larger text it stopped at
    // the box and the docked keyboard covered Check (inner screen turned, 669 by 951, 26 Oct 2026). Once the keyboard has settled, if the box's
    // own Check (or Send feedback and its line) is under it, the page scrolls up just enough, never past the box's top. Nothing covered, nothing moves.
    function fitColumn(f){
      // No docked keyboard (desktop, a hardware keyboard: the visual viewport is the page's height), or zoomed in: nothing to do.
      const up=!!f && touch && vv.scale<1.05 && document.documentElement.clientHeight-vv.height>=100;
      if(capped && (capped!==f || !up)) uncap();
      if(!due) return; due=false;
      if(!up) return;
      // The visible part is measured from the top of the page's view. On the Duo simulator the visual viewport's offset disagreed with where
      // the keyboard was drawn (by up to 160 pt) while its height held, so the height alone (or innerHeight, if lower) is the bottom, and the
      // top is the status-bar strip (body::before), so the box never goes under the clock.
      const vTop=parseFloat(getComputedStyle(document.body, '::before').height)||0, vBot=Math.min(vv.height, window.innerHeight), {act, fr0, fr}=span(f);
      if(fr.bottom<=vBot-8) return;
      capNote(f, act, fr0, fr, vTop, vBot);
      const d=Math.round(Math.min(fr.bottom-(vBot-8), fr.top-(vTop+8)));
      if(d>0) window.scrollBy(0, d);
    }
    function fit(){
      pend=0;
      const sc=document.getElementById('screen'); if(!sc) return;
      if(!twoColumns()){ setKb(sc, 0); fitColumn(typingIn(sc)); return; }
      const f=typingIn(sc); due=false;
      const floatPad=touch && !!f && Date.now()-focusAt>=600 && vv.height>=window.innerHeight-100;   // the bar over the keys alone takes 68
      const vTop=vv.offsetTop, vBot=vv.offsetTop+(floatPad ? Math.min(vv.height, Math.round(window.innerHeight*0.55)) : vv.height);
      let over=0;
      if(f && vv.scale<1.05){ over=Math.max(0, Math.round(sc.getBoundingClientRect().bottom-vBot)); if(over<60) over=0; }  // under 60: a toolbar or rounding, not a keyboard
      setKb(sc, over);
      if(capped && (capped!==f || !over)) uncap();
      if(!f || !over) return;
      // The box and its Check together: at larger text Check wraps under the box and stayed under the keyboard (Duo, 25 Oct 2026).
      // A box outside an answer row brings the button row right after it: Send feedback, and since 26 Oct the status line under it too.
      const r=sc.getBoundingClientRect(), top=Math.max(r.top, vTop), bot=Math.min(r.bottom, vBot), {act, fr0, fr}=span(f);
      capNote(f, act, fr0, fr, top, bot);
      // Too tall for what is left: the box first, at the top of the gap, and as much of the rest as fits.
      if(fr.top<top+8 || fr.bottom>bot-8) sc.scrollTop+=Math.round(fr.bottom-fr.top>bot-top-16 ? fr.top-(top+8) : (fr.top+fr.bottom)/2-(top+bot)/2);
    }
    function setKb(sc, over){ if(over===kb) return; kb=over; if(over) sc.style.setProperty('--kb', over+'px'); else sc.style.removeProperty('--kb'); document.body.classList.toggle('kb', !!over); }
    const soon=()=>{ if(!pend) pend=requestAnimationFrame(fit); };
    // One column acts only after focus or a keyboard change, 350 ms on (after iOS's own scroll), never on a scroll, so it does not fight a child scrolling back up to reread.
    const settle=()=>{ clearTimeout(dueT); dueT=setTimeout(()=>{ due=true; soon(); }, 350); };
    vv.addEventListener('resize', ()=>{ soon(); settle(); }); vv.addEventListener('scroll', soon);
    document.addEventListener('focusin', ()=>{ soon(); focusAt=Date.now(); clearTimeout(padT); padT=setTimeout(soon, 650); settle(); });
    // Later than a tap: the padding must not move a Check button between the finger going down and
    // the click, and the layout keeper above restores its reading place 150 ms after a resize.
    document.addEventListener('focusout', ()=>setTimeout(soon, 250));
    window.addEventListener('resize', ()=>setTimeout(soon, 250));
  })();
})();
</script>
</body>
